<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Street Football Ultimate</title><style>*{box-sizing:border-box}body{margin:0;background:#06100a;color:#fff;font-family:Arial,sans-serif}header{height:58px;background:#09130c;display:flex;align-items:center;justify-content:space-between;padding:0 12px}.brand{font-weight:900}.coins{font-weight:900}.wrap{padding:8px}.game{position:relative;margin:auto;width:min(1100px,100%);height:calc(100vh - 74px);max-height:760px;overflow:hidden;border:3px solid #fff;border-radius:15px;background:#15813b}.field{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#15813b 0 9%,#187d3b 9% 18%)}.line{position:absolute;background:#fff9}.mid{left:50%;top:0;width:3px;height:100%}.circle{left:50%;top:50%;width:130px;height:130px;border:3px solid #fff9;border-radius:50%;transform:translate(-50%,-50%)}.box{top:28%;height:44%;width:14%;border:3px solid #fff9}.left{left:0}.right{right:0}.goal{position:absolute;top:43%;height:14%;width:30px;background:#fff8;border:2px solid #fff}.gl{left:-30px}.gr{right:-30px}.player{position:absolute;width:38px;height:52px;z-index:5;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 2px #0008);transition:left .06s linear,top .06s linear}.head{position:absolute;left:50%;top:0;transform:translateX(-50%);width:17px;height:17px;border-radius:50%;background:#c98b68;border:1px solid #222}.body{position:absolute;left:50%;top:15px;transform:translateX(-50%);width:27px;height:24px;border-radius:8px 8px 5px 5px;border:2px solid #fff}.leg{position:absolute;top:37px;width:7px;height:15px;background:#111;border-radius:3px}.l{left:11px}.r{right:11px}.home .body{background:#e91e63}.away .body{background:#1976d2}.gk .body{background:#f59e0b}.nameTag{position:absolute;top:53px;left:50%;transform:translateX(-50%);font-size:8px;font-weight:900;background:#07100dcc;padding:2px 4px;border-radius:4px;white-space:nowrap}.sel{filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 3px #fff)}.ball{position:absolute;width:19px;height:19px;border-radius:50%;background:#fff;border:3px solid #111;z-index:8;transition:left .04s linear,top .04s linear}.hud{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:15;background:#07100ddd;padding:7px 12px;border-radius:99px;font-weight:900;white-space:nowrap}.controls{position:absolute;inset:0;z-index:20;pointer-events:none}.joy{position:absolute;left:15px;bottom:15px;width:120px;height:120px;border:2px solid #fff7;background:#0003;border-radius:50%;pointer-events:auto;touch-action:none}.stick{position:absolute;left:34px;top:34px;width:48px;height:48px;border-radius:50%;background:#fff7}.buttons{position:absolute;right:14px;bottom:14px;display:grid;grid-template-columns:repeat(2,68px);gap:8px;pointer-events:auto}.buttons button{width:68px;height:58px;border:2px solid #fff;border-radius:12px;background:#000b;color:#fff;font-weight:900}.modal{position:absolute;inset:0;background:#06100be8;z-index:40;display:grid;place-items:center}.panel{width:min(430px,92%);max-height:90%;overflow:auto;background:#101b13;border:1px solid #46634a;border-radius:18px;padding:20px;text-align:center}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.tabs button,.menu button{background:#17261a;color:#fff;border:1px solid #46634a;padding:9px;border-radius:8px;font-weight:800}.card{background:#17261a;border:1px solid #46634a;border-radius:12px;padding:12px;margin:8px 0;text-align:left}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.primary{background:#18a957!important;border:0!important;width:100%;font-size:16px}.small{font-size:12px;color:#cbd8cd}@media(max-width:600px){.player{width:34px;height:47px}.body{width:24px}.nameTag{font-size:7px}.ball{width:18px;height:18px}.brand{font-size:13px}.hud{font-size:12px}.buttons{grid-template-columns:repeat(2,62px)}.buttons button{width:62px;height:54px}}</style></head><body><header><div class="brand">⚽ STREET FOOTBALL</div><div id="coinTop" class="coins">🪙 500</div></header><div class="wrap"><div class="game" id="game"><div class="field"><div class="line mid"></div><div class="circle"></div><div class="line box left"></div><div class="line box right"></div><div class="goal gl"></div><div class="goal gr"></div></div><div class="hud"><span id="score">0 — 0</span> · <span id="clock">02:00</span></div><div id="players"></div><div id="ball" class="ball"></div><div class="controls"><div id="joy" class="joy"><div id="stick" class="stick"></div></div><div class="buttons"><button id="pass">PASS</button><button id="shoot">SHOOT</button><button id="tackle">TACKLE</button><button id="switch">SWITCH</button></div></div><div id="modal" class="modal"><div id="panel" class="panel"></div></div></div></div><script>const $=id=>document.getElementById(id),teams=['Lagos Lions','City Stars','United FC','Coastal Kings'];let save=JSON.parse(localStorage.getItem('sf_save')||'null')||{name:'Player',coins:500,wins:0,losses:0,draws:0,level:1,upgrade:0,leader:[]};let selected=0,running=false,time=120,score=[0,0],dx=0,dy=0,controlled=0,owner=0,bx=21,by=50,vx=0,vy=0,players=[];function persist(){localStorage.setItem('sf_save',JSON.stringify(save));$('coinTop').textContent='🪙 '+save.coins}function menu(){running=false;$('modal').style.display='grid';$('panel').innerHTML='<h1>⚽ Street Football Ultimate</h1><p>Move, pass, shoot and score.</p><input id="name" value="'+save.name+'" style="width:100%;padding:12px;border-radius:8px;border:0"><div class="tabs"><button onclick="showTeams()">TEAM</button><button onclick="showCareer()">CAREER</button><button onclick="showBoard()">LEADERBOARD</button></div><div id="menuBody"></div><button class="primary" onclick="startMatch()">PLAY MATCH</button>';showTeams()}function showTeams(){let h='<div class="grid">';teams.forEach((t,i)=>h+='<button onclick="selected='+i+';showTeams()" style="padding:14px;border-radius:10px;background:'+(selected===i?'#18a957':'#17261a')+';color:#fff">'+t+'</button>');h+='</div><p class="small">Selected: '+teams[selected]+'</p>';$('menuBody').innerHTML=h}function showCareer(){$('menuBody').innerHTML='<div class="card"><b>'+save.name+'</b><p>Level '+save.level+' · Wins '+save.wins+' · Losses '+save.losses+' · Draws '+save.draws+'</p></div><button onclick="upgrade()">UPGRADE · 100 🪙</button>'}function showBoard(){let l=save.leader.slice().sort((a,b)=>b.wins-a.wins).slice(0,8);$('menuBody').innerHTML='<div class="card"><b>🏆 TOP PLAYERS</b>'+((l.length?l:[{name:save.name,wins:save.wins}]).map((p,i)=>'<p>'+(i+1)+'. '+p.name+' — '+p.wins+' wins</p>').join(''))+'</div>'}function upgrade(){if(save.coins>=100){save.coins-=100;save.upgrade++;save.level=Math.floor(save.upgrade/2)+1;persist();showCareer()}}function add(side,name,x,y,role){let e=document.createElement('div');e.className='player '+(side==='H'?'home':'away')+(role==='GK'?' gk':'');e.innerHTML='<div class="head"></div><div class="body"></div><div class="leg l"></div><div class="leg r"></div><div class="nameTag">'+name+'</div>';$('players').appendChild(e);players.push({side,name,x,y,role,e,homeX:x,homeY:y,phase:Math.random()*6.28,dir:Math.random()<.5?1:-1})}function setup(){players=[];$('players').innerHTML='';add('H','YOU',18,50,'ST');add('H','A',30,25,'ST');add('H','B',30,75,'ST');add('H','C',43,40,'MF');add('H','GK',6,50,'GK');add('A','9',70,30,'ST');add('A','11',70,70,'ST');add('A','8',58,50,'MF');add('A','7',82,50,'ST');add('A','GK',94,50,'GK');controlled=0;owner=0;bx=21;by=50;vx=.055;vy=.018;render()}function render(){players.forEach((p,i)=>{p.e.style.left=p.x+'%';p.e.style.top=p.y+'%';p.e.classList.toggle('sel',i===controlled)});$('ball').style.left=bx+'%';$('ball').style.top=by+'%';$('score').textContent=score[0]+' — '+score[1]}function fmt(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}function say(s){let h=$('game').querySelector('.hud');h.textContent=s;setTimeout(()=>{if(running)h.innerHTML='<span id="score">'+score[0]+' — '+score[1]+'</span> · <span id="clock">'+fmt(time)+'</span>'},800)}function startMatch(){let n=$('name');if(n&&n.value.trim())save.name=n.value.trim();persist();$('modal').style.display='none';running=true;time=120;score=[0,0];setup();say('KICK-OFF!')}function pass(){if(!running||owner!==controlled)return;let m=players[controlled],best=players.map((p,i)=>({p,i})).filter(o=>o.p.side==='H'&&o.i!==controlled&&o.p.role!=='GK').sort((a,b)=>Math.hypot(a.p.x-m.x,a.p.y-m.y)-Math.hypot(b.p.x-m.x,b.p.y-m.y))[0];if(!best)return;let p=best.p,l=Math.hypot(p.x-m.x,p.y-m.y)||1;owner=-1;vx=(p.x-m.x)/l*.12;vy=(p.y-m.y)/l*.12}function shoot(){if(!running||owner!==controlled)return;let m=players[controlled],l=Math.hypot(97-m.x,50-m.y)||1;owner=-1;vx=(97-m.x)/l*.22;vy=(50-m.y)/l*.22;say('SHOT!')}function tackle(){if(!running)return;let m=players[controlled],ix=players.findIndex(p=>p.side==='A'&&Math.hypot(p.x-m.x,p.y-m.y)<10);if(ix>=0){owner=controlled;bx=m.x+3;by=m.y;say('TACKLE!')}}function sw(){let c=players.map((p,i)=>({p,i})).filter(o=>o.p.side==='H'&&o.p.role!=='GK');let q=c.findIndex(o=>o.i===controlled);controlled=c[(q+1)%c.length].i;if(owner>=0&&players[owner].side==='H'){owner=controlled;bx=players[controlled].x+3;by=players[controlled].y}}function moveToward(p,x,y,s,dt){let a=x-p.x,b=y-p.y,l=Math.hypot(a,b);if(l>.1){let d=Math.min(l,s*dt);p.x+=a/l*d;p.y+=b/l*d}}function ai(dt){let t=dt/16,now=performance.now()/1000;players.forEach((p,i)=>{if(i===controlled||p.role==='GK')return;let tx=p.homeX+Math.sin(now*.9+p.phase)*7,ty=p.homeY+Math.cos(now*1.1+p.phase)*6;if(owner<0&&Math.hypot(p.x-bx,p.y-by)<38){tx=bx;ty=by}else if(owner>=0&&p.side!==players[owner].side){tx=bx;ty=by}else if(owner>=0&&p.side==='H'){tx=p.homeX+Math.sin(now*1.5+p.phase)*9;ty=p.homeY+Math.cos(now*1.25+p.phase)*7}moveToward(p,tx,ty,p.side==='A'?.11:.09,t)}if(owner>=0){let p=players[owner];bx=p.x+(p.side==='H'?3:-3);by=p.y}else{bx+=vx*dt;by+=vy*dt;vx*=.997;vy*=.997;if(bx>96||bx<4){vx*=-1}if(by>94||by<6){vy*=-1}let hit=players.findIndex(p=>p.role!=='GK'&&Math.hypot(p.x-bx,p.y-by)<3.2);if(hit>=0){owner=hit;vx=vy=0}}}function finish(){running=false;let r=score[0]>score[1]?'WIN':score[0]<score[1]?'LOSS':'DRAW';if(r==='WIN'){save.wins++;save.coins+=100}else if(r==='LOSS')save.losses++;else save.draws++;save.leader.push({name:save.name,wins:save.wins});persist();$('modal').style.display='grid';$('panel').innerHTML='<h1>'+({WIN:'🏆 YOU WIN!',LOSS:'😅 MATCH LOST',DRAW:'🤝 DRAW'})[r]+'</h1><p>'+score[0]+' — '+score[1]+'</p><button class="primary" onclick="menu()">CONTINUE</button>'}let last=performance.now();function loop(now){let dt=Math.min(32,now-last);last=now;if(running){let m=players[controlled];m.x=Math.max(3,Math.min(97,m.x+dx*dt*.09));m.y=Math.max(5,Math.min(95,m.y+dy*dt*.09));if(owner===controlled){bx=m.x+3;by=m.y}ai(dt);render()}requestAnimationFrame(loop)}setInterval(()=>{if(running){time--;let c=$('clock');if(c)c.textContent=fmt(time);if(time<=0)finish()}},1000);const joy=$('joy'),stick=$('stick');function joyMove(e){e.preventDefault();let r=joy.getBoundingClientRect(),a=e.clientX-(r.left+r.width/2),b=e.clientY-(r.top+r.height/2),l=Math.hypot(a,b),m=38;if(l>m){a=a/l*m;b=b/l*m}stick.style.transform='translate('+a+'px,'+b+'px)';dx=a/m;dy=b/m}function joyStop(){dx=dy=0;stick.style.transform=''}joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);joyMove(e)});joy.addEventListener('pointermove',joyMove);joy.addEventListener('pointerup',joyStop);joy.addEventListener('pointercancel',joyStop);$('pass').onpointerdown=pass;$('shoot').onpointerdown=shoot;$('tackle').onpointerdown=tackle;$('switch').onpointerdown=sw;persist();menu();requestAnimationFrame(loop);</script></body></html>
