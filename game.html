<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Street Football Ultimate</title><style>*{box-sizing:border-box}html,body{margin:0;background:#06100a;color:#fff;font-family:Arial,sans-serif;overflow:hidden}.game{position:relative;width:min(1100px,100vw);height:100vh;max-height:760px;margin:auto;overflow:hidden;border:3px solid #fff;border-radius:15px;background:#16833d}.field{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#16833d 0 9%,#187d3b 9% 18%)}.mid{left:50%;top:0;height:100%;border-left:3px solid #fff9;position:absolute}.circle{left:50%;top:50%;width:130px;height:130px;border:3px solid #fff9;border-radius:50%;transform:translate(-50%,-50%);position:absolute}.box{top:28%;height:44%;width:14%;border:3px solid #fff9;position:absolute}.left{left:0}.right{right:0}.goal{position:absolute;top:43%;height:14%;width:2%;border:3px solid #fff;background:#ffffff18;z-index:2}.goal.left{left:-1%}.goal.right{right:-1%}.player{position:absolute;width:38px;height:52px;z-index:5;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 2px #0008);transform-origin:50% 80%}.head{position:absolute;left:50%;top:0;transform:translateX(-50%);width:17px;height:17px;border-radius:50%;background:#c98b68;border:1px solid #222}.body{position:absolute;left:50%;top:15px;transform:translateX(-50%);width:27px;height:24px;border:2px solid #fff;border-radius:8px;background:#e91e63}.away .body{background:#1976d2}.gk .body{background:#f59e0b}.leg{position:absolute;top:37px;width:7px;height:15px;background:#111;border-radius:3px;transform-origin:50% 0}.l{left:11px}.r{right:11px}.name{position:absolute;top:53px;left:50%;transform:translateX(-50%);font-size:8px;font-weight:900;background:#07100ddd;padding:2px 4px;border-radius:4px;white-space:nowrap}.sel{filter:drop-shadow(0 0 7px #fff)}.walking .body{animation:bodyBob .18s ease-in-out infinite alternate}.walking .l{animation:legL .18s ease-in-out infinite alternate}.walking .r{animation:legR .18s ease-in-out infinite alternate}.runningPose .body{animation:bodyBob .12s ease-in-out infinite alternate}.runningPose .l{animation:legL .12s ease-in-out infinite alternate}.runningPose .r{animation:legR .12s ease-in-out infinite alternate}@keyframes bodyBob{from{transform:translateX(-50%) translateY(0) rotate(-2deg)}to{transform:translateX(-50%) translateY(-2px) rotate(2deg)}}@keyframes legL{from{transform:rotate(25deg)}to{transform:rotate(-25deg)}}@keyframes legR{from{transform:rotate(-25deg)}to{transform:rotate(25deg)}}.ball{position:absolute;width:19px;height:19px;border-radius:50%;background:#fff;border:3px solid #111;z-index:8;transform:translate(-50%,-50%)}.hud{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:20;background:#07100ddd;padding:7px 12px;border-radius:99px;font-weight:900;white-space:nowrap}.status{position:absolute;top:49px;left:50%;transform:translateX(-50%);z-index:20;font-size:11px;font-weight:900;background:#07100daa;padding:4px 8px;border-radius:8px;white-space:nowrap}.controls{position:absolute;inset:0;z-index:30;pointer-events:none}.joy{position:absolute;left:15px;bottom:15px;width:120px;height:120px;border:2px solid #fff7;background:#0004;border-radius:50%;pointer-events:auto;touch-action:none}.stick{position:absolute;left:34px;top:34px;width:48px;height:48px;border-radius:50%;background:#fff8}.buttons{position:absolute;right:14px;bottom:14px;display:grid;grid-template-columns:repeat(2,68px);gap:8px;pointer-events:auto}.buttons button{height:58px;border:2px solid #fff;border-radius:12px;background:#000b;color:#fff;font-weight:900;touch-action:manipulation}.modal{position:absolute;inset:0;background:#06100bea;z-index:40;display:grid;place-items:center}.panel{width:min(430px,92%);background:#101b13;border:1px solid #46634a;border-radius:18px;padding:20px;text-align:center}.primary{width:100%;padding:12px;border-radius:9px;background:#18a957;color:#fff;border:0;font-weight:900;margin-top:12px}@media(max-width:600px){.player{width:34px;height:47px}.body{width:24px}.name{font-size:7px}.buttons{grid-template-columns:repeat(2,62px)}.buttons button{width:62px;height:54px}}</style></head><body><div class="game" id="game"><div class="field"><div class="mid"></div><div class="circle"></div><div class="box left"></div><div class="box right"></div><div class="goal left"></div><div class="goal right"></div></div><div class="hud" id="hud">0 — 0 · 02:00</div><div class="status" id="status">Ready</div><div id="players"></div><div class="ball" id="ball"></div><div class="controls"><div class="joy" id="joy"><div class="stick" id="stick"></div></div><div class="buttons"><button id="pass">PASS</button><button id="shoot">SHOOT</button><button id="tackle">TACKLE</button><button id="switch">SWITCH</button></div></div><div class="modal" id="modal"><div class="panel"><h1>⚽ Street Football</h1><p>5v5 · Human-style movement</p><input id="name" placeholder="Your name" maxlength="18" style="width:100%;padding:12px"><button class="primary" id="start">PLAY MATCH</button></div></div></div><script>
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));let running=false,time=120,score=[0,0],controlled=0,owner=0,bx=21,by=50,bvx=.12,bvy=0,dx=0,dy=0,players=[],lastTouch=-1,kickCooldown=0,goalCooldown=0,kickoff=0,aiKickCooldown=0;
function add(side,name,x,y,role){const e=document.createElement('div');e.className='player '+(side==='H'?'home':'away')+(role==='GK'?' gk':'');e.innerHTML='<div class="head"></div><div class="body"></div><div class="leg l"></div><div class="leg r"></div><div class="name">'+name+'</div>';$('players').appendChild(e);players.push({side,name,x,y,homeX:x,homeY:y,role,e,phase:Math.random()*6.28,speed:side==='A'?5.4:5.0,lastX:x,lastY:y});}
function setup(){players=[];$('players').innerHTML='';add('H','YOU',18,50,'ST');add('H','A',31,25,'ST');add('H','B',31,75,'ST');add('H','C',43,40,'MF');add('H','GK',6,50,'GK');add('A','9',70,30,'ST');add('A','11',70,70,'ST');add('A','8',58,50,'MF');add('A','7',82,50,'ST');add('A','GK',94,50,'GK');controlled=0;owner=0;bx=21;by=50;kickCooldown=1;goalCooldown=0;kickoff=1.2;aiKickCooldown=.8;render();}
function render(){players.forEach((p,i)=>{let mx=p.x-p.lastX,my=p.y-p.lastY,m=Math.hypot(mx,my);p.e.style.left=p.x+'%';p.e.style.top=p.y+'%';p.e.classList.toggle('sel',i===controlled);p.e.classList.toggle('walking',m>.008);p.e.classList.toggle('runningPose',m>.035);if(m>.02){p.e.style.transform='translate(-50%,-50%) rotate('+clamp(mx*45,-12,12)+'deg)';}else p.e.style.transform='translate(-50%,-50%)';p.lastX=p.x;p.lastY=p.y});$('ball').style.left=bx+'%';$('ball').style.top=by+'%';$('hud').textContent=score[0]+' — '+score[1]+' · '+String(Math.floor(time/60)).padStart(2,'0')+':'+String(time%60).padStart(2,'0');$('status').textContent=kickoff>0?'KICK OFF':owner>=0?(players[owner].name+' has the ball'):'BALL IN PLAY';}
function start(){running=true;time=120;score=[0,0];$('modal').style.display='none';setup();}
function move(p,tx,ty,s,dt){let ax=tx-p.x,ay=ty-p.y,d=Math.hypot(ax,ay);if(d>.08){let step=Math.min(d,s*dt);p.x+=ax/d*step;p.y+=ay/d*step;}}
function aiKick(i){let p=players[i];if(owner!==i)return;let tx=p.side==='A'?2:98,ty=50+(Math.random()*16-8),d=Math.hypot(tx-p.x,ty-p.y)||1;owner=-1;lastTouch=i;bx=p.x+(p.side==='A'?-3:3);by=p.y;bvx=(tx-p.x)/d*(p.side==='A'?.3:.24);bvy=(ty-p.y)/d*(p.side==='A'?.3:.24);kickCooldown=.55;aiKickCooldown=1.5;}
function updateAI(dt,now){const t=now*.001;players.forEach((p,i)=>{if(i===controlled)return;let tx=p.homeX+Math.sin(t*1.2+p.phase)*5,ty=p.homeY+Math.cos(t*1.05+p.phase)*5;if(p.role==='GK'){move(p,p.side==='H'?6:94,clamp(by,28,72),3.8,dt);if(owner===i&&kickCooldown<=0)aiKick(i);return}if(owner===i){tx=p.side==='A'?96:4;ty=50+(p.homeY-50)*.35;if(p.side==='A'&&p.x>78&&aiKickCooldown<=0)aiKick(i);else move(p,tx,ty,p.speed,dt);return}if(owner>=0&&players[owner].side!==p.side){tx=clamp(bx+(p.side==='A'?3:-3),5,95);ty=by;move(p,tx,ty,p.speed*1.12,dt);if(p.side==='A'&&Math.hypot(p.x-players[owner].x,p.y-players[owner].y)<7.2&&kickCooldown<=0){owner=i;lastTouch=i;kickCooldown=.45;return}return}if(owner===-1&&Math.hypot(p.x-bx,p.y-by)<35){move(p,bx,by,p.speed*1.08,dt);return}move(p,tx,ty,p.speed*.72,dt)});}
function updateBall(dt){if(goalCooldown>0){goalCooldown-=dt;if(goalCooldown<=0)resetKickoff();return}if(kickoff>0){kickoff-=dt;bx=21;by=50;return}if(owner>=0){let p=players[owner];bx=p.x+(p.side==='H'?3.2:-3.2);by=p.y;return}bx+=bvx*dt;by+=bvy*dt;bvx*=Math.pow(.985,dt);bvy*=Math.pow(.985,dt);if(by<5){by=5;bvy=Math.abs(bvy)*.75}if(by>95){by=95;bvy=-Math.abs(bvy)*.75}if(by>42&&by<58&&bx<=1){score[1]++;goalCooldown=1.8;owner=-1;return}if(by>42&&by<58&&bx>=99){score[0]++;goalCooldown=1.8;owner=-1;return}if(bx<2){bx=2;bvx=Math.abs(bvx)*.75}if(bx>98){bx=98;bvx=-Math.abs(bvx)*.75}if(kickCooldown>0)return;let best=-1,bd=4.5;players.forEach((p,i)=>{let d=Math.hypot(p.x-bx,p.y-by);if(d<bd){bd=d;best=i}});if(best>=0){owner=best;lastTouch=best;bvx=bvy=0}}
function resetKickoff(){players.forEach(p=>{p.x=p.homeX;p.y=p.homeY;p.lastX=p.x;p.lastY=p.y});controlled=0;owner=0;bx=21;by=50;bvx=.12;bvy=0;kickCooldown=.8;kickoff=1.2;goalCooldown=0}
function pass(){if(!running||kickoff>0||owner!==controlled||kickCooldown>0)return;let p=players[controlled],m=players.filter((q,i)=>q.side==='H'&&q.role!=='GK'&&i!==controlled).sort((a,b)=>Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y))[0];if(!m)return;let d=Math.hypot(m.x-p.x,m.y-p.y)||1;owner=-1;lastTouch=controlled;bvx=(m.x-p.x)/d*.25;bvy=(m.y-p.y)/d*.25;bx=p.x+3;by=p.y;kickCooldown=.35}
function shoot(){if(!running||kickoff>0||owner!==controlled||kickCooldown>0)return;let p=players[controlled],ty=50+(Math.random()*12-6),d=Math.hypot(99-p.x,ty-p.y)||1;owner=-1;lastTouch=controlled;bx=p.x+3;by=p.y;bvx=(99-p.x)/d*.36;bvy=(ty-p.y)/d*.36;kickCooldown=.55}
function tackle(){if(!running||kickoff>0)return;let p=players[controlled],i=players.findIndex(q=>q.side==='A'&&Math.hypot(q.x-p.x,q.y-p.y)<10);if(i>=0){owner=controlled;lastTouch=controlled;kickCooldown=.45}}
function sw(){let c=players.map((p,i)=>({p,i})).filter(o=>o.p.side==='H'&&o.p.role!=='GK'),q=c.findIndex(o=>o.i===controlled);controlled=c[(q+1+c.length)%c.length].i}
function joyMove(e){e.preventDefault();let r=$('joy').getBoundingClientRect(),a=e.clientX-r.left-r.width/2,b=e.clientY-r.top-r.height/2,d=Math.hypot(a,b),m=38;if(d>m){a=a/d*m;b=b/d*m}$('stick').style.transform='translate('+a+'px,'+b+'px)';dx=a/m;dy=b/m}function joyStop(){dx=dy=0;$('stick').style.transform=''}
function loop(now){if(!loop.last)loop.last=now;let dt=Math.min(.032,(now-loop.last)/1000);loop.last=now;if(running){kickCooldown=Math.max(0,kickCooldown-dt);aiKickCooldown=Math.max(0,aiKickCooldown-dt);let p=players[controlled];if(kickoff<=0&&goalCooldown<=0){p.x=clamp(p.x+dx*8.5*dt,3,97);p.y=clamp(p.y+dy*8.5*dt,5,95)}updateBall(dt);updateAI(dt,now);render()}requestAnimationFrame(loop)}
$('start').onclick=start;$('pass').onpointerdown=pass;$('shoot').onpointerdown=shoot;$('tackle').onpointerdown=tackle;$('switch').onpointerdown=sw;let j=$('joy');j.addEventListener('pointerdown',e=>{try{j.setPointerCapture(e.pointerId)}catch(_){}joyMove(e)});j.addEventListener('pointermove',joyMove);['pointerup','pointercancel','lostpointercapture'].forEach(x=>j.addEventListener(x,joyStop));setInterval(()=>{if(running){time--;if(time<=0){running=false;$('status').textContent='FULL TIME'}}},1000);requestAnimationFrame(loop);
</script></body></html>
