<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Street Football 5v5</title><style>
*{box-sizing:border-box}body{margin:0;background:#07140b;color:#fff;font-family:Arial,sans-serif;overflow:hidden}.top{height:58px;background:#08100b;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #29402c}.top b{font-size:17px}.score{font-weight:900;font-size:20px}.wrap{height:calc(100vh - 58px);display:grid;place-items:center;padding:8px}.game{position:relative;width:min(1100px,100%);height:min(680px,calc(100vh - 74px));background:#16803b;border:3px solid #fff;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px #0008}.field{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#16803b 0 9%,#187d3b 9% 18%)}.line{position:absolute;background:#ffffffbb}.mid{left:50%;top:0;width:3px;height:100%;transform:translateX(-50%)}.circle{left:50%;top:50%;width:130px;height:130px;border:3px solid #ffffffbb;border-radius:50%;transform:translate(-50%,-50%)}.box{top:28%;height:44%;width:13%;border:3px solid #ffffffbb;background:transparent}.left{left:0}.right{right:0}.goal{position:absolute;top:43%;width:28px;height:14%;background:#fff8;border:2px solid #fff}.goal.l{left:-28px}.goal.r{right:-28px}.player{position:absolute;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:900;border:2px solid #fff;z-index:4;user-select:none;transition:transform .05s}.home{background:#e91e63}.away{background:#1976d2}.gk{background:#f59e0b}.selected{box-shadow:0 0 0 4px #fff,0 0 18px #fff}.ball{position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid #111;box-shadow:0 2px 8px #0008;z-index:5}.hud{position:absolute;top:9px;left:50%;transform:translateX(-50%);z-index:8;background:#07100bdd;border:1px solid #ffffff55;padding:7px 13px;border-radius:99px;font-weight:800;white-space:nowrap}.controls{position:absolute;inset:0;z-index:10;pointer-events:none}.joy{position:absolute;left:16px;bottom:17px;width:118px;height:118px;border:2px solid #ffffff66;background:#0003;border-radius:50%;pointer-events:auto;touch-action:none}.stick{position:absolute;width:48px;height:48px;left:33px;top:33px;border-radius:50%;background:#ffffff66}.actions{position:absolute;right:15px;bottom:16px;display:grid;grid-template-columns:repeat(2,68px);gap:9px;pointer-events:auto}.actions button{width:68px;height:68px;border-radius:50%;border:2px solid #fff;background:#0009;color:#fff;font-weight:900;touch-action:none}.actions .wide{grid-column:span 2;width:68px;margin:auto}.hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:11px;background:#0008;padding:6px 9px;border-radius:8px;z-index:12}.modal{position:absolute;inset:0;background:#06100bdf;z-index:20;display:grid;place-items:center}.panel{background:#101b13;border:1px solid #3b5d40;border-radius:18px;padding:24px;text-align:center;width:min(390px,92%)}.panel h1{margin:0 0 8px}.panel p{color:#cbd8cd}.teamgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:16px 0}.team{padding:12px;border:1px solid #45634a;border-radius:10px;background:#16251a;color:#fff;font-weight:800}.team.active{outline:3px solid #18a957}.start{border:0;background:#18a957;color:#fff;padding:13px 25px;border-radius:10px;font-weight:900;font-size:16px}@media(max-width:600px){.game{height:calc(100vh - 74px)}.player{width:28px;height:28px;font-size:8px}.ball{width:18px;height:18px}.hint{display:none}.top b{font-size:14px}.score{font-size:17px}}
</style></head><body><header class="top"><b>⚽ STREET FOOTBALL 5v5</b><div class="score"><span id="us">0</span> — <span id="them">0</span></div><span id="time">02:00</span></header><main class="wrap"><div class="game" id="game"><div class="field"><div class="line mid"></div><div class="circle"></div><div class="line box left"></div><div class="line box right"></div><div class="goal l"></div><div class="goal r"></div></div><div class="hud" id="msg">Choose your team</div><div id="players"></div><div class="ball" id="ball"></div><div class="controls"><div class="joy" id="joy"><div class="stick" id="stick"></div></div><div class="actions"><button id="pass">PASS</button><button id="shoot">SHOOT</button><button id="tackle">TACKLE</button><button id="switch">SWITCH</button></div><div class="hint">Joystick • PASS • SHOOT • TACKLE • SWITCH</div></div><div class="modal" id="modal"><div class="panel"><h1>⚽ Street Football</h1><p>Pick your team. Control one player and beat the rival 5v5.</p><div class="teamgrid" id="teams"></div><button class="start" id="start">START MATCH</button></div></div></div></main><script>
const game=document.getElementById('game'),playersEl=document.getElementById('players'),ball=document.getElementById('ball'),msg=document.getElementById('msg'),teamsEl=document.getElementById('teams');
const teams=['Lagos Lions','City Stars','United FC','Coastal Kings'];let selectedTeam=0,running=false,t=120,us=0,them=0,dx=0,dy=0,controlled=0,ballOwner=-1,ballX=50,ballY=50,shot={vx:0,vy:0},last=performance.now(),cool=0;
let players=[];
function makeTeams(){teams.forEach((n,i)=>{let b=document.createElement('button');b.className='team'+(i===0?' active':'');b.textContent=n;b.onclick=()=>{selectedTeam=i;document.querySelectorAll('.team').forEach(x=>x.classList.remove('active'));b.classList.add('active')};teamsEl.appendChild(b)})}
function add(side,name,x,y,role){let el=document.createElement('div');el.className='player '+(side==='home'?'home':'away')+(role==='GK'?' gk':'');el.textContent=name;playersEl.appendChild(el);players.push({side,name,x,y,homeX:x,homeY:y,role,el})}
function setup(){players=[];playersEl.innerHTML='';add('home','YOU',18,50,'ST');add('home','A',30,25,'ST');add('home','B',32,72,'ST');add('home','C',43,40,'MF');add('home','GK',6,50,'GK');add('away','9',70,30,'ST');add('away','11',70,70,'ST');add('away','8',58,50,'MF');add('away','7',82,50,'ST');add('away','GK',94,50,'GK');controlled=0;players[0].el.classList.add('selected');ballOwner=0;ballX=21;ballY=50;shot={vx:0,vy:0};render()}
function render(){players.forEach((p,i)=>{p.el.style.left=p.x+'%';p.el.style.top=p.y+'%';p.el.classList.toggle('selected',i===controlled)});ball.style.left=ballX+'%';ball.style.top=ballY+'%'}
function say(s){msg.textContent=s;clearTimeout(window.mt);window.mt=setTimeout(()=>{if(running)msg.textContent='Play!'},1100)}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function nearestMate(){let me=players[controlled],best=-1,bd=999;players.forEach((p,i)=>{if(i!==controlled&&p.side==='home'&&p.role!=='GK'){let d=dist(me,p);if(d<bd){bd=d;best=i}}});return best}
function pass(){if(!running||ballOwner!==controlled)return;let i=nearestMate();if(i<0)return;let p=players[i],m=players[controlled];let vx=p.x-m.x,vy=p.y-m.y,l=Math.hypot(vx,vy)||1;ballOwner=-1;shot={vx:vx/l*1.5,vy:vy/l*1.5};say('Pass!')}
function shoot(){if(!running||ballOwner!==controlled)return;let m=players[controlled],goalX=96;let vx=goalX-m.x,vy=50-m.y,l=Math.hypot(vx,vy)||1;ballOwner=-1;shot={vx:vx/l*3.4,vy:vy/l*3.4};say('SHOOT! 🔥')}
function tackle(){if(!running)return;let me=players[controlled],target=-1,bd=8;players.forEach((p,i)=>{if(p.side==='away'){let d=dist(me,p);if(d<bd){bd=d;target=i}}});if(target>=0){ballOwner=controlled;say('Great tackle!');players[target].x+=4}}
function switchPlayer(){if(!running)return;let candidates=players.map((p,i)=>({p,i})).filter(o=>o.p.side==='home'&&o.p.role!=='GK');let idx=candidates.findIndex(o=>o.i===controlled);controlled=candidates[(idx+1)%candidates.length].i;ballOwner=controlled;say('Player switched')}
function goal(){us++;document.getElementById('us').textContent=us;say('GOAL! ⚽🔥');setup()}
function ai(dt){let ballP={x:ballX,y:ballY};players.forEach((p,i)=>{if(p.side==='away'&&p.role!=='GK'){let d=dist(p,ballP);if(ballOwner<0||d<24){let vx=ballX-p.x,vy=ballY-p.y,l=Math.hypot(vx,vy)||1;p.x+=vx/l*dt*.045;p.y+=vy/l*dt*.045}else{p.x+=(p.homeX-p.x)*dt*.001;p.y+=(p.homeY-p.y)*dt*.001}}if(p.side==='home'&&i!==controlled&&p.role!=='GK'){p.x+=(p.homeX-p.x)*dt*.0015;p.y+=(p.homeY-p.y)*dt*.0015}});let carrier=players.findIndex(p=>p.side==='away'&&dist(p,{x:ballX,y:ballY})<3);if(ballOwner<0&&carrier>=0){ballOwner=carrier;shot={vx:0,vy:0}}if(ballOwner>=0&&players[ballOwner].side==='away'){let p=players[ballOwner];ballX=p.x-3;ballY=p.y;if(p.x<12){them++;document.getElementById('them').textContent=them;say('Opponent scored');setup()}}}
function update(now){let dt=Math.min(32,now-last);last=now;if(running){if(t<=0){end();return}let me=players[controlled];me.x=Math.max(3,Math.min(97,me.x+dx*dt*.055));me.y=Math.max(5,Math.min(95,me.y+dy*dt*.055));if(ballOwner===controlled){ballX=me.x+3;ballY=me.y}else if(ballOwner<0){ballX+=shot.vx*dt/16;ballY+=shot.vy*dt/16;shot.vx*=.985;shot.vy*=.985;let catchI=players.findIndex((p,i)=>dist(p,{x:ballX,y:ballY})<3);if(catchI>=0&&Math.abs(shot.vx)+Math.abs(shot.vy)<3){ballOwner=catchI;say(players[catchI].side==='home'?'Ball recovered':'Opponent has it')}}ai(dt);if(ballX>99&&ballY>38&&ballY<62)goal();cool=Math.max(0,cool-dt)}render()}requestAnimationFrame(update)}
function end(){running=false;document.getElementById('modal').style.display='grid';document.querySelector('.panel').innerHTML='<h1>'+ (us>them?'🏆 YOU WIN!':us<them?'😅 MATCH LOST':'🤝 DRAW')+'</h1><p>'+teams[selectedTeam]+' '+us+' — '+them+' Rivals</p><button class="start" onclick="location.reload()">PLAY AGAIN</button>'}
setInterval(()=>{if(running){t--;document.getElementById('time').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}},1000);
const joy=document.getElementById('joy'),stick=document.getElementById('stick');function move(e){e.preventDefault();let r=joy.getBoundingClientRect(),p=e.touches?e.touches[0]:e,cx=r.left+r.width/2,cy=r.top+r.height/2,a=p.clientX-cx,b=p.clientY-cy,l=Math.hypot(a,b),m=38;if(l>m){a=a/l*m;b=b/l*m}stick.style.transform='translate('+a+'px,'+b+'px)';dx=a/m;dy=b/m}function stop(){dx=dy=0;stick.style.transform=''}joy.addEventListener('pointerdown',move);joy.addEventListener('pointermove',move);joy.addEventListener('pointerup',stop);joy.addEventListener('pointercancel',stop);joy.addEventListener('pointerleave',stop);document.getElementById('pass').onpointerdown=pass;document.getElementById('shoot').onpointerdown=shoot;document.getElementById('tackle').onpointerdown=tackle;document.getElementById('switch').onpointerdown=switchPlayer;document.getElementById('start').onclick=()=>{document.getElementById('modal').style.display='none';running=true;t=120;us=them=0;document.getElementById('us').textContent=0;document.getElementById('them').textContent=0;document.getElementById('time').textContent='02:00';setup();say('Kick-off!')};makeTeams();setup();requestAnimationFrame(update);
</script></body></html>
