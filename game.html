<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Street Football Ultimate</title><style>*{box-sizing:border-box}body{margin:0;background:#06100a;color:white;font-family:Arial,sans-serif}header{height:58px;padding:0 12px;display:flex;justify-content:space-between;align-items:center;background:#09130c;font-weight:900}.wrap{padding:8px}.game{position:relative;width:min(1100px,100%);height:calc(100vh - 74px);max-height:760px;margin:auto;overflow:hidden;border:3px solid white;border-radius:15px;background:#16833d}.field{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#16833d 0 9%,#187d3b 9% 18%)}.line{position:absolute;border-color:#fff9}.mid{left:50%;top:0;height:100%;border-left:3px solid}.circle{left:50%;top:50%;width:130px;height:130px;border:3px solid #fff9;border-radius:50%;transform:translate(-50%,-50%)}.box{top:28%;height:44%;width:14%;border:3px solid #fff9}.left{left:0}.right{right:0}.player{position:absolute;width:38px;height:52px;z-index:5;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 2px #0008)}.head{position:absolute;left:50%;top:0;transform:translateX(-50%);width:17px;height:17px;border-radius:50%;background:#c98b68;border:1px solid #222}.body{position:absolute;left:50%;top:15px;transform:translateX(-50%);width:27px;height:24px;border:2px solid white;border-radius:8px;background:#e91e63}.away .body{background:#1976d2}.gk .body{background:#f59e0b}.leg{position:absolute;top:37px;width:7px;height:15px;background:#111;border-radius:3px}.l{left:11px}.r{right:11px}.name{position:absolute;top:53px;left:50%;transform:translateX(-50%);font-size:8px;font-weight:900;background:#07100ddd;padding:2px 4px;border-radius:4px;white-space:nowrap}.sel{filter:drop-shadow(0 0 6px white)}.ball{position:absolute;width:19px;height:19px;border-radius:50%;background:white;border:3px solid #111;z-index:8}.hud{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:20;background:#07100ddd;padding:7px 12px;border-radius:99px;font-weight:900;white-space:nowrap}.controls{position:absolute;inset:0;z-index:30;pointer-events:none}.joy{position:absolute;left:15px;bottom:15px;width:120px;height:120px;border:2px solid #fff7;background:#0004;border-radius:50%;pointer-events:auto;touch-action:none}.stick{position:absolute;left:34px;top:34px;width:48px;height:48px;border-radius:50%;background:#fff8}.buttons{position:absolute;right:14px;bottom:14px;display:grid;grid-template-columns:repeat(2,68px);gap:8px;pointer-events:auto}.buttons button{height:58px;border:2px solid white;border-radius:12px;background:#000b;color:white;font-weight:900}.modal{position:absolute;inset:0;background:#06100bea;z-index:40;display:grid;place-items:center}.panel{width:min(430px,92%);background:#101b13;border:1px solid #46634a;border-radius:18px;padding:20px;text-align:center}.panel button,.primary{padding:12px;border-radius:9px;background:#18a957;color:white;border:0;font-weight:900}.primary{width:100%;margin-top:12px}@media(max-width:600px){.player{width:34px;height:47px}.body{width:24px}.name{font-size:7px}.buttons{grid-template-columns:repeat(2,62px)}.buttons button{width:62px;height:54px}}</style></head><body><header><b>⚽ STREET FOOTBALL</b><span id="coins">🪙 500</span></header><div class="wrap"><div class="game" id="game"><div class="field"><div class="mid"></div><div class="circle"></div><div class="box left"></div><div class="box right"></div></div><div class="hud" id="hud">0 — 0 · 02:00</div><div id="players"></div><div class="ball" id="ball"></div><div class="controls"><div class="joy" id="joy"><div class="stick" id="stick"></div></div><div class="buttons"><button id="pass">PASS</button><button id="shoot">SHOOT</button><button id="tackle">TACKLE</button><button id="switch">SWITCH</button></div></div><div class="modal" id="modal"><div class="panel"><h1>⚽ Street Football</h1><p>The players will move automatically.</p><input id="name" placeholder="Your name" style="width:100%;padding:12px"><button class="primary" id="start">PLAY MATCH</button></div></div></div></div><script>
const $=id=>document.getElementById(id);let running=false,time=120,score=[0,0],controlled=0,owner=0,bx=21,by=50,bvx=0,bvy=0,dx=0,dy=0,players=[];let save=JSON.parse(localStorage.getItem('sf_save')||'null')||{name:'Player',coins:500,wins:0,losses:0,draws:0};$('coins').textContent='🪙 '+save.coins;
function add(side,name,x,y,role){let e=document.createElement('div');e.className='player '+(side==='H'?'home':'away')+(role==='GK'?' gk':'');e.innerHTML='<div class="head"></div><div class="body"></div><div class="leg l"></div><div class="leg r"></div><div class="name">'+name+'</div>';$("players").appendChild(e);players.push({side,name,x,y,homeX:x,homeY:y,role,e,phase:Math.random()*6.28});}
function setup(){players=[];$("players").innerHTML='';add('H','YOU',18,50,'ST');add('H','A',31,25,'ST');add('H','B',31,75,'ST');add('H','C',43,40,'MF');add('H','GK',6,50,'GK');add('A','9',70,30,'ST');add('A','11',70,70,'ST');add('A','8',58,50,'MF');add('A','7',82,50,'ST');add('A','GK',94,50,'GK');controlled=0;owner=0;bx=21;by=50;bvx=.14;bvy=.035;render();}
function render(){players.forEach((p,i)=>{p.e.style.left=p.x+'%';p.e.style.top=p.y+'%';p.e.classList.toggle('sel',i===controlled)});$('ball').style.left=bx+'%';$('ball').style.top=by+'%';$('hud').textContent=score[0]+' — '+score[1]+' · '+String(Math.floor(time/60)).padStart(2,'0')+':'+String(time%60).padStart(2,'0');}
function start(){save.name=$('name').value.trim()||save.name;localStorage.setItem('sf_save',JSON.stringify(save));$('modal').style.display='none';running=true;time=120;score=[0,0];setup();}
function move(p,tx,ty,s,dt){let ax=tx-p.x,ay=ty-p.y,d=Math.hypot(ax,ay);if(d>.05){let step=Math.min(d,s*dt);p.x+=ax/d*step;p.y+=ay/d*step;}}
function updateAI(dt,now){let ballX=bx,ballY=by;players.forEach((p,i)=>{if(i===controlled||p.role==='GK')return;let tx=p.homeX+Math.sin(now*.0012+p.phase)*8,ty=p.homeY+Math.cos(now*.0010+p.phase)*6;if(owner===-1&&Math.hypot(p.x-ballX,p.y-ballY)<42){tx=ballX;ty=ballY}else if(owner>=0&&p.side!==players[owner].side){tx=ballX;ty=ballY}else if(owner>=0&&p.side==='H'){tx=p.homeX+Math.sin(now*.0018+p.phase)*11;ty=p.homeY+Math.cos(now*.0015+p.phase)*8;}move(p,tx,ty,p.side==='A'?.105:.095,dt);});}
function updateBall(dt){if(owner>=0){let p=players[owner];bx=p.x+(p.side==='H'?3:-3);by=p.y;return;}bx+=bvx*dt;by+=bvy*dt;bvx*=.997;bvy*=.997;if(bx>97||bx<3)bvx*=-1;if(by>94||by<6)bvy*=-1;let hit=players.findIndex(p=>p.role!=='GK'&&Math.hypot(p.x-bx,p.y-by)<3.5);if(hit>=0){owner=hit;bvx=bvy=0;}}
function loop(now){if(!loop.last)loop.last=now;let dt=Math.min(32,now-loop.last);loop.last=now;if(running){let p=players[controlled];p.x=Math.max(3,Math.min(97,p.x+dx*dt*.09));p.y=Math.max(5,Math.min(95,p.y+dy*dt*.09));if(owner===controlled){bx=p.x+3;by=p.y;}else updateBall(dt);updateAI(dt,now);render();}requestAnimationFrame(loop);}
function pass(){if(!running||owner!==controlled)return;let m=players[controlled],c=players.map((p,i)=>({p,i})).filter(o=>o.p.side==='H'&&o.i!==controlled&&o.p.role!=='GK').sort((a,b)=>Math.hypot(a.p.x-m.x,a.p.y-m.y)-Math.hypot(b.p.x-m.x,b.p.y-m.y))[0];if(c){let d=Math.hypot(c.p.x-m.x,c.p.y-m.y)||1;owner=-1;bvx=(c.p.x-m.x)/d*.16;bvy=(c.p.y-m.y)/d*.16;}}
function shoot(){if(!running||owner!==controlled)return;let p=players[controlled],d=Math.hypot(97-p.x,50-p.y)||1;owner=-1;bvx=(97-p.x)/d*.3;bvy=(50-p.y)/d*.3;}
function tackle(){if(!running)return;let p=players[controlled],i=players.findIndex(q=>q.side==='A'&&Math.hypot(q.x-p.x,q.y-p.y)<11);if(i>=0){owner=controlled;bx=p.x+3;by=p.y;}}
function sw(){let c=players.map((p,i)=>({p,i})).filter(o=>o.p.side==='H'&&o.p.role!=='GK');let q=c.findIndex(o=>o.i===controlled);controlled=c[(q+1)%c.length].i;if(owner>=0&&players[owner].side==='H'){owner=controlled;bx=players[controlled].x+3;by=players[controlled].y;}}
function joyMove(e){e.preventDefault();let r=$('joy').getBoundingClientRect(),a=e.clientX-r.left-r.width/2,b=e.clientY-r.top-r.height/2,d=Math.hypot(a,b),m=38;if(d>m){a=a/d*m;b=b/d*m;}$('stick').style.transform='translate('+a+'px,'+b+'px)';dx=a/m;dy=b/m;}
function joyStop(){dx=dy=0;$('stick').style.transform='';}
$('start').onclick=start;$('pass').onpointerdown=pass;$('shoot').onpointerdown=shoot;$('tackle').onpointerdown=tackle;$('switch').onpointerdown=sw;let j=$('joy');j.addEventListener('pointerdown',e=>{j.setPointerCapture(e.pointerId);joyMove(e)});j.addEventListener('pointermove',joyMove);j.addEventListener('pointerup',joyStop);j.addEventListener('pointercancel',joyStop);setInterval(()=>{if(running){time--;if(time<=0){running=false;$('modal').style.display='grid';$('modal').querySelector('.panel').innerHTML='<h1>FULL TIME</h1><p>'+score[0]+' — '+score[1]+'</p><button class="primary" onclick="location.reload()">CONTINUE</button>';}}},1000);requestAnimationFrame(loop);
</script></body></html>
