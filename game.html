<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Street Football</title><style>*{box-sizing:border-box}body{margin:0;background:#07140b;color:#fff;font-family:Arial,sans-serif;overflow:hidden}.top{height:58px;background:#08100b;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #243626}.top b{font-size:18px}.score{font-weight:800;font-size:20px}.wrap{height:calc(100vh - 58px);display:grid;place-items:center;padding:10px}.game{position:relative;width:min(1100px,100%);height:min(680px,calc(100vh - 78px));background:#16803b;border:3px solid #fff;border-radius:14px;overflow:hidden;box-shadow:0 20px 60px #0008}.field{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#16803b 0 9%,#187d3b 9% 18%)}.line{position:absolute;background:#ffffffcc}.mid{left:50%;top:0;width:3px;height:100%;transform:translateX(-50%)}.circle{left:50%;top:50%;width:130px;height:130px;border:3px solid #ffffffcc;border-radius:50%;transform:translate(-50%,-50%)}.box{top:28%;height:44%;width:13%;border:3px solid #ffffffcc}.left{left:0}.right{right:0}.goal{position:absolute;top:43%;width:28px;height:14%;background:#fff8;border:2px solid #fff}.goal.l{left:-28px}.goal.r{right:-28px}.ball{position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid #111;box-shadow:0 2px 8px #0008;z-index:5}.player{position:absolute;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:900;border:2px solid #fff;z-index:4;user-select:none}.me{background:#e91e63}.opp{background:#1976d2}.hud{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:8;background:#07100bd9;border:1px solid #ffffff55;padding:7px 14px;border-radius:99px;font-weight:800}.controls{position:absolute;inset:0;z-index:10;pointer-events:none}.joy{position:absolute;left:18px;bottom:18px;width:120px;height:120px;border:2px solid #ffffff66;background:#0003;border-radius:50%;pointer-events:auto;touch-action:none}.stick{position:absolute;width:50px;height:50px;left:33px;top:33px;border-radius:50%;background:#ffffff66}.actions{position:absolute;right:18px;bottom:20px;display:flex;gap:12px;pointer-events:auto}.actions button{width:70px;height:70px;border-radius:50%;border:2px solid #fff;background:#0008;color:#fff;font-weight:900;touch-action:none}.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:12px;background:#0008;padding:7px 10px;border-radius:8px;z-index:12}.modal{position:absolute;inset:0;background:#06100bcc;z-index:20;display:grid;place-items:center}.panel{background:#101b13;border:1px solid #3b5d40;border-radius:18px;padding:28px;text-align:center;width:min(360px,90%)}.panel h1{margin-top:0}.panel button{border:0;background:#18a957;color:#fff;padding:13px 25px;border-radius:10px;font-weight:800;font-size:16px}@media(max-width:600px){.game{height:calc(100vh - 78px)}.player{width:29px;height:29px}.ball{width:19px;height:19px}.hint{display:none}}
</style></head><body><header class="top"><b>⚽ STREET FOOTBALL</b><div class="score"><span id="us">0</span> — <span id="them">0</span></div><span id="time">02:00</span></header><main class="wrap"><div class="game" id="game"><div class="field"><div class="line mid"></div><div class="circle"></div><div class="line box left"></div><div class="line box right"></div><div class="goal l"></div><div class="goal r"></div></div><div class="hud" id="msg">Get the ball!</div><div class="player me" id="me">YOU</div><div class="player me" id="mate">10</div><div class="player opp" id="o1">9</div><div class="player opp" id="o2">11</div><div class="ball" id="ball"></div><div class="controls"><div class="joy" id="joy"><div class="stick" id="stick"></div></div><div class="actions"><button id="pass">PASS</button><button id="shoot">SHOOT</button></div></div><div class="hint">Move with the joystick • PASS • SHOOT</div><div class="modal" id="modal"><div class="panel"><h1>⚽ Street Football</h1><p>2-minute match. Score more goals than the blue team!</p><button id="start">START MATCH</button></div></div></div></main><script>
const game=document.getElementById('game'),me=document.getElementById('me'),mate=document.getElementById('mate'),o1=document.getElementById('o1'),o2=document.getElementById('o2'),ball=document.getElementById('ball'),msg=document.getElementById('msg');let running=false,t=120,us=0,them=0,x=18,y=50,bx=50,by=50,dx=0,dy=0,ballOwner='me',shooting=false;
function pos(el,a,b){el.style.left=a+'%';el.style.top=b+'%'}function reset(){x=18;y=50;bx=x;by=y;ballOwner='me';pos(me,x,y);pos(ball,bx,by);pos(mate,35,28);pos(o1,62,38);pos(o2,78,62)}function msgx(s){msg.textContent=s;clearTimeout(window.mt);window.mt=setTimeout(()=>msg.textContent='Get the ball!',1300)}
function kick(){if(!running)return;if(ballOwner==='me'){ballOwner='free';let ang=Math.atan2(dy||0,-1);let speed=shooting?10:5;let tx=Math.min(100,bx+speed);bx=tx;by=Math.max(8,Math.min(92,by+(dy*18)));shooting=false;msgx('Shot!')}}
function score(){us++;document.getElementById('us').textContent=us;msgx('GOAL! 🔥');reset()}
function tick(){if(!running)return;t--;document.getElementById('time').textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');if(t<=0){running=false;document.getElementById('modal').style.display='grid';document.querySelector('.panel').innerHTML='<h1>'+ (us>them?'🏆 YOU WIN!':us<them?'😅 MATCH LOST':'🤝 DRAW')+'</h1><p>Final score: '+us+' — '+them+'</p><button onclick="location.reload()">PLAY AGAIN</button>'}}
setInterval(tick,1000);function loop(){if(running){x+=dx*.75;y+=dy*.75;x=Math.max(4,Math.min(96,x));y=Math.max(7,Math.min(93,y));pos(me,x,y);if(ballOwner==='me'){bx=x+3;by=y}else{bx+=.7;if(bx>98)score()}pos(ball,bx,by);if(Math.abs(bx-78)<3&&Math.abs(by-62)<5){ballOwner='o2';msgx('Opponent has it!')}if(ballOwner==='free'&&Math.hypot(bx-x,by-y)<5)ballOwner='me'}requestAnimationFrame(loop)}loop();
const joy=document.getElementById('joy'),stick=document.getElementById('stick');function move(e){const r=joy.getBoundingClientRect(),p=e.touches?e.touches[0]:e,cx=r.left+r.width/2,cy=r.top+r.height/2;let a=p.clientX-cx,b=p.clientY-cy,l=Math.hypot(a,b),m=38;if(l>m){a=a/l*m;b=b/l*m}stick.style.transform='translate('+a+'px,'+b+'px)';dx=a/m;dy=b/m}function stop(){dx=dy=0;stick.style.transform=''}joy.addEventListener('pointermove',move);joy.addEventListener('pointerdown',move);joy.addEventListener('pointerup',stop);joy.addEventListener('pointercancel',stop);joy.addEventListener('pointerleave',stop);document.getElementById('pass').onpointerdown=()=>{shooting=false;kick()};document.getElementById('shoot').onpointerdown=()=>{shooting=true;kick()};document.getElementById('start').onclick=()=>{document.getElementById('modal').style.display='none';running=true;reset()};reset();
</script></body></html>
