<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Street Football Ultimate</title><style>*{box-sizing:border-box}body{margin:0;background:#06100a;color:#fff;font-family:Arial,sans-serif}header{height:58px;background:#09130c;display:flex;align-items:center;justify-content:space-between;padding:0 12px;position:sticky;top:0;z-index:30}.brand{font-weight:900}.coins{font-weight:900}.wrap{padding:8px}.game{position:relative;margin:auto;width:min(1100px,100%);height:calc(100vh - 74px);max-height:760px;overflow:hidden;border:3px solid #fff;border-radius:15px;background:#15813b}.field{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#15813b 0 9%,#187d3b 9% 18%)}.line{position:absolute;background:#fff9}.mid{left:50%;top:0;width:3px;height:100%}.circle{left:50%;top:50%;width:130px;height:130px;border:3px solid #fff9;border-radius:50%;transform:translate(-50%,-50%)}.box{top:28%;height:44%;width:14%;border:3px solid #fff9;background:transparent}.left{left:0}.right{right:0}.goal{position:absolute;top:43%;height:14%;width:30px;background:#fff8;border:2px solid #fff}.gl{left:-30px}.gr{right:-30px}.player{position:absolute;width:38px;height:52px;z-index:5;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 2px #0008)}.player .head{position:absolute;left:50%;top:0;transform:translateX(-50%);width:17px;height:17px;border-radius:50%;background:#c98b68;border:1px solid #222}.player .body{position:absolute;left:50%;top:15px;transform:translateX(-50%);width:27px;height:24px;border-radius:8px 8px 5px 5px;border:2px solid #fff}.player .leg{position:absolute;top:37px;width:7px;height:15px;background:#111;border-radius:3px}.player .l{left:11px}.player .r{right:11px}.home .body{background:#e91e63}.away .body{background:#1976d2}.gk .body{background:#f59e0b}.nameTag{position:absolute;top:53px;left:50%;transform:translateX(-50%);font-size:8px;font-weight:900;background:#07100dcc;padding:2px 4px;border-radius:4px;white-space:nowrap}.sel{filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 3px #fff)}.ball{position:absolute;width:19px;height:19px;border-radius:50%;background:#fff;border:3px solid #111;z-index:8}.hud{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:15;background:#07100ddd;padding:7px 12px;border-radius:99px;font-weight:900;white-space:nowrap}.controls{position:absolute;inset:0;z-index:20;pointer-events:none}.joy{position:absolute;left:15px;bottom:15px;width:120px;height:120px;border:2px solid #fff7;background:#0003;border-radius:50%;pointer-events:auto;touch-action:none}.stick{position:absolute;left:34px;top:34px;width:48px;height:48px;border-radius:50%;background:#fff7}.buttons{position:absolute;right:14px;bottom:14px;display:grid;grid-template-columns:repeat(2,68px);gap:8px;pointer-events:auto}.buttons button,.menu button{border:2px solid #fff;border-radius:12px;background:#000b;color:#fff;font-weight:900;padding:12px}.buttons button{width:68px;height:58px}.modal{position:absolute;inset:0;background:#06100be8;z-index:40;display:grid;place-items:center}.panel{width:min(430px,92%);max-height:90%;overflow:auto;background:#101b13;border:1px solid #46634a;border-radius:18px;padding:20px;text-align:center}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:10px 0}.tabs button{background:#17261a;color:#fff;border:1px solid #46634a;padding:9px;border-radius:8px;font-weight:800}.card{background:#17261a;border:1px solid #46634a;border-radius:12px;padding:12px;margin:8px 0;text-align:left}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.primary{background:#18a957!important;border:0!important;width:100%;font-size:16px}.small{font-size:12px;color:#cbd8cd}@media(max-width:600px){.player{width:34px;height:47px}.player .body{width:24px}.nameTag{font-size:7px}.ball{width:18px;height:18px}.brand{font-size:13px}.hud{font-size:12px}.buttons{grid-template-columns:repeat(2,62px)}.buttons button{width:62px;height:54px}}</style></head><body><header><div class="brand">⚽ STREET FOOTBALL</div><div id="coinTop" class="coins">🪙 500</div></header><div class="wrap"><div class="game" id="game"><div class="field"><div class="line mid"></div><div class="circle"></div><div class="line box left"></div><div class="line box right"></div><div class="goal gl"></div><div class="goal gr"></div></div><div class="hud"><span id="score">0 — 0</span> · <span id="clock">02:00</span></div><div id="players"></div><div id="ball" class="ball"></div><div class="controls"><div id="joy" class="joy"><div id="stick" class="stick"></div></div><div class="buttons"><button id="pass">PASS</button><button id="shoot">SHOOT</button><button id="tackle">TACKLE</button><button id="switch">SWITCH</button></div></div><div id="modal" class="modal"><div id="panel" class="panel"></div></div></div></div><script>const $=id=>document.getElementById(id),teams=['Lagos Lions','City Stars','United FC','Coastal Kings'];let save=JSON.parse(localStorage.getItem('sf_save')||'null')||{name:'Player',coins:500,wins:0,losses:0,draws:0,level:1,upgrade:0,leader:[]};let selected=0,running=false,time=120,score=[0,0],dx=0,dy=0,controlled=0,owner=0,bx=21,by=50,shot={x:0,y:0},players=[];function persist(){localStorage.setItem('sf_save',JSON.stringify(save));$('coinTop').textContent='🪙 '+save.coins}function menu(){running=false;$('modal').style.display='grid';$('panel').innerHTML='<h1>⚽ Street Football Ultimate</h1><p>Build your career, win matches and upgrade your player.</p><input id="name" value="'+save.name+'" placeholder="Player name" style="width:100%;padding:12px;border-radius:8px;border:0;margin:5px 0"><div class="tabs"><button onclick="showTeams()">TEAM</button><button onclick="showCareer()">CAREER</button><button onclick="showBoard()">LEADERBOARD</button></div><div id="menuBody"></div><button class="primary" onclick="startMatch()">PLAY MATCH</button>';showTeams()}function showTeams(){let h='<div class="grid">';teams.forEach((t,i)=>h+='<button onclick="selected='+i+';showTeams()" style="padding:14px;border-radius:10px;background:'+(selected===i?'#18a957':'#17261a')+';color:#fff;border:1px solid #46634a;font-weight:900">'+t+'</button>');h+='</div><p class="small">Selected: '+teams[selected]+'</p>';$('menuBody').innerHTML=h}function showCareer(){$('menuBody').innerHTML='<div class="card"><b>'+save.name+'</b><p>Level '+save.level+' · Wins '+save.wins+' · Losses '+save.losses+' · Draws '+save.draws+'</p><p>Upgrade points: '+save.upgrade+'</p></div><button onclick="upgrade()" style="padding:11px;border-radius:8px">UPGRADE PLAYER · 100 🪙</button>'}function showBoard(){let list=save.leader.slice().sort((a,b)=>b.wins-a.wins).slice(0,8);if(!list.length)list=[{name:save.name,wins:save.wins}];$('menuBody').innerHTML='<div class="card"><b>🏆 TOP PLAYERS</b>'+list.map((p,i)=>'<p>'+(i+1)+'. '+p.name+' — '+p.wins+' wins</p>').join('')+'</div>'}function upgrade(){if(save.coins>=100){save.coins-=100;save.upgrade++;save.level=Math.floor(save.upgrade/2)+1;persist();showCareer()}}function add(side,name,x,y,role){let e=document.createElement('div');e.className='player '+(side==='H'?'home':'away')+(role==='GK'?' gk':'');e.innerHTML='<div class="head"></div><div class="body"></div><div class="leg l"></div><div class="leg r"></div><div class="nameTag">'+name+'</div>';$('players').appendChild(e);players.push({side,name,x,y,role,e})}function setup(){players=[];$('players').innerHTML='';add('H','YOU',18,50,'ST');add('H','A',30,25,'ST');add('H','B',30,75,'ST');add('H','C',43,40,'MF');add('H','GK',6,50,'GK');add('A','9',70,30,'ST');add('A','11',70,70,'ST');add('A','8',58,50,'MF');add('A','7',82,50,'ST');add('A','GK',94,50,'GK');controlled=0;owner=0;bx=21;by=50;shot={x:0,y:0};render()}function render(){players.forEach((p,i)=>{p.e.style.left=p.x+'%';p.e.style.top=p.y+'%';p.e.classList.toggle('sel',i===controlled)});$('ball').style.left=bx+'%';$('ball').style.top=by+'%';$('score').textContent=score[0]+' — '+score[1]}function say(s){$('panel').style.display='none';$('game').querySelector('.hud').textContent=s;setTimeout(()=>{$('game').querySelector('.hud').textContent=$('score').textContent+' · '+fmt(time)},900)}function fmt(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}function startMatch(){let n=$('name');if(n&&n.value.trim())save.name=n.value.trim();persist();$('modal').style.display='none';$('panel').style.display='block';running=true;time=120;score=[0,0];setup();say('KICK-OFF!')}function pass(){if(!running||owner!==controlled)return;let me=players[controlled],mates=players.map((p,i)=>({p,i})).filter(o=>o.p.side==='H'&&o.i!==controlled&&o.p.role!=='GK').sort((a,b)=>Math.hypot(a.p.x-me.x,a.p.y-me.y)-Math.hypot(b.p.x-me.x,b.p.y-me.y));if(!mates.length)return;let p=mates[0].p,l=Math.hypot(p.x-me.x,p.y-me.y)||1;owner=-1;shot={x:(p.x-me.x)/l*1.8,y:(p.y-me.y)/l*1.8}}function shoot(){if(!running||owner!==controlled)return;let m=players[controlled],l=Math.hypot(96-m.x,50-m.y)||1;owner=-1;shot={x:(96-m.x)/l*3.8,y:(50-m.y)/l*3.8};say('SHOT!')}function tackle(){if(!running)return;let m=players[controlled],ix=players.findIndex((p,i)=>p.side==='A'&&Math.hypot(p.x-m.x,p.y-m.y)<8);if(ix>=0){owner=controlled;players[ix].x+=4;say('TACKLE!')}}function sw(){let c=players.map((p,i)=>({p,i})).filter(o=>o.p.side==='H'&&o.p.role!=='GK');let q=c.findIndex(o=>o.i===controlled);controlled=c[(q+1)%c.length].i;owner=controlled;say('SWITCHED')}function goal(){score[0]++;save.coins+=50;persist();say('GOAL! +50 🪙');setTimeout(setup,350)}function ai(dt){players.forEach(p=>{if(p.side==='A'&&p.role!=='GK'){let l=Math.hypot(bx-p.x,by-p.y)||1;p.x+=(bx-p.x)/l*dt*.04;p.y+=(by-p.y)/l*dt*.04}});if(owner>=5){let p=players[owner];bx=p.x-3;by=p.y;if(p.x<10){score[1]++;say('RIVALS SCORED');setup()}}else if(owner<0){let ix=players.findIndex(p=>Math.hypot(p.x-bx,p.y-by)<3);if(ix>=0&&Math.abs(shot.x)+Math.abs(shot.y)<3)owner=ix}}function finish(){running=false;let result=score[0]>score[1]?'WIN':score[0]<score[1]?'LOSS':'DRAW';if(result==='WIN'){save.wins++;save.coins+=100}else if(result==='LOSS')save.losses++;else save.draws++;save.leader.push({name:save.name,wins:save.wins});persist();$('modal').style.display='grid';$('panel').style.display='block';$('panel').innerHTML='<h1>'+({WIN:'🏆 YOU WIN!',LOSS:'😅 MATCH LOST',DRAW:'🤝 DRAW'})[result]+'</h1><p>'+teams[selected]+' '+score[0]+' — '+score[1]+'</p><p>Coins: 🪙 '+save.coins+'</p><button class="primary" onclick="menu()">CONTINUE</button>'}let last=performance.now();function loop(now){let dt=Math.min(35,now-last);last=now;if(running){let m=players[controlled];m.x=Math.max(3,Math.min(97,m.x+dx*dt*.055));m.y=Math.max(5,Math.min(95,m.y+dy*dt*.055));if(owner===controlled){bx=m.x+3;by=m.y}else if(owner<0){bx+=shot.x*dt/16;by+=shot.y*dt/16;shot.x*=.985;shot.y*=.985;if(bx>99&&by>38&&by<62)goal()}ai(dt);render()}requestAnimationFrame(loop)}setInterval(()=>{if(running){time--;if(time<=0)finish();$('clock').textContent=fmt(time)}},1000);const joy=$('joy'),stick=$('stick');function move(e){e.preventDefault();let r=joy.getBoundingClientRect(),p=e.touches?e.touches[0]:e,a=p.clientX-(r.left+r.width/2),b=p.clientY-(r.top+r.height/2),l=Math.hypot(a,b),m=38;if(l>m){a=a/l*m;b=b/l*m}stick.style.transform='translate('+a+'px,'+b+'px)';dx=a/m;dy=b/m}function stop(){dx=dy=0;stick.style.transform=''}joy.addEventListener('pointerdown',move);joy.addEventListener('pointermove',move);joy.addEventListener('pointerup',stop);joy.addEventListener('pointercancel',stop);joy.addEventListener('pointerleave',stop);$('pass').onpointerdown=pass;$('shoot').onpointerdown=shoot;$('tackle').onpointerdown=tackle;$('switch').onpointerdown=sw;persist();menu();requestAnimationFrame(loop);</script></body></html>
