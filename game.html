<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Street Football Ultimate</title><style>*{box-sizing:border-box}html,body{margin:0;background:#06100a;color:#fff;font-family:Arial,sans-serif;overflow:hidden}header{height:58px;padding:0 12px;display:flex;justify-content:space-between;align-items:center;background:#09130c;font-weight:900}.wrap{padding:8px}.game{position:relative;width:min(1100px,100%);height:calc(100vh - 74px);max-height:760px;margin:auto;overflow:hidden;border:3px solid #fff;border-radius:15px;background:#16833d}.field{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#16833d 0 9%,#187d3b 9% 18%)}.line{position:absolute;border-color:#fff9}.mid{left:50%;top:0;height:100%;border-left:3px solid}.circle{left:50%;top:50%;width:130px;height:130px;border:3px solid #fff9;border-radius:50%;transform:translate(-50%,-50%)}.box{top:28%;height:44%;width:14%;border:3px solid #fff9}.left{left:0}.right{right:0}.goal{position:absolute;top:43%;height:14%;width:2%;border:3px solid #fff;background:#ffffff18;z-index:2}.goal.left{left:-1%}.goal.right{right:-1%}.player{position:absolute;width:38px;height:52px;z-index:5;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 2px #0008);transition:filter .1s}.head{position:absolute;left:50%;top:0;transform:translateX(-50%);width:17px;height:17px;border-radius:50%;background:#c98b68;border:1px solid #222}.body{position:absolute;left:50%;top:15px;transform:translateX(-50%);width:27px;height:24px;border:2px solid #fff;border-radius:8px;background:#e91e63}.away .body{background:#1976d2}.gk .body{background:#f59e0b}.leg{position:absolute;top:37px;width:7px;height:15px;background:#111;border-radius:3px}.l{left:11px}.r{right:11px}.name{position:absolute;top:53px;left:50%;transform:translateX(-50%);font-size:8px;font-weight:900;background:#07100ddd;padding:2px 4px;border-radius:4px;white-space:nowrap}.sel{filter:drop-shadow(0 0 7px #fff)}.ball{position:absolute;width:19px;height:19px;border-radius:50%;background:#fff;border:3px solid #111;z-index:8;transform:translate(-50%,-50%)}.hud{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:20;background:#07100ddd;padding:7px 12px;border-radius:99px;font-weight:900;white-space:nowrap}.status{position:absolute;top:49px;left:50%;transform:translateX(-50%);z-index:20;font-size:11px;font-weight:900;background:#07100daa;padding:4px 8px;border-radius:8px;white-space:nowrap}.controls{position:absolute;inset:0;z-index:30;pointer-events:none}.joy{position:absolute;left:15px;bottom:15px;width:120px;height:120px;border:2px solid #fff7;background:#0004;border-radius:50%;pointer-events:auto;touch-action:none}.stick{position:absolute;left:34px;top:34px;width:48px;height:48px;border-radius:50%;background:#fff8}.buttons{position:absolute;right:14px;bottom:14px;display:grid;grid-template-columns:repeat(2,68px);gap:8px;pointer-events:auto}.buttons button{height:58px;border:2px solid #fff;border-radius:12px;background:#000b;color:#fff;font-weight:900;touch-action:manipulation}.modal{position:absolute;inset:0;background:#06100bea;z-index:40;display:grid;place-items:center}.panel{width:min(430px,92%);background:#101b13;border:1px solid #46634a;border-radius:18px;padding:20px;text-align:center}.panel button,.primary{padding:12px;border-radius:9px;background:#18a957;color:#fff;border:0;font-weight:900}.primary{width:100%;margin-top:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.stat{background:#07100d;padding:9px;border-radius:9px}.small{font-size:12px;opacity:.8}@media(max-width:600px){.player{width:34px;height:47px}.body{width:24px}.name{font-size:7px}.buttons{grid-template-columns:repeat(2,62px)}.buttons button{width:62px;height:54px}}</style></head><body><header><b>⚽ STREET FOOTBALL</b><span id="coins">🪙 500</span></header><div class="wrap"><div class="game" id="game"><div class="field"><div class="mid"></div><div class="circle"></div><div class="box left"></div><div class="box right"></div><div class="goal left"></div><div class="goal right"></div></div><div class="hud" id="hud">0 — 0 · 02:00</div><div class="status" id="status">Ready</div><div id="players"></div><div class="ball" id="ball"></div><div class="controls"><div class="joy" id="joy"><div class="stick" id="stick"></div></div><div class="buttons"><button id="pass">PASS</button><button id="shoot">SHOOT</button><button id="tackle">TACKLE</button><button id="switch">SWITCH</button></div></div><div class="modal" id="modal"><div class="panel"><h1>⚽ Street Football</h1><p>5v5 · 2-minute match</p><input id="name" placeholder="Your name" maxlength="18" style="width:100%;padding:12px"><button class="primary" id="start">PLAY MATCH</button><p class="small">Move with the joystick. Pass, shoot, tackle and switch players.</p></div></div></div></div><script>
const $=id=>document.getElementById(id);const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));let running=false,matchOver=false,time=120,score=[0,0],controlled=0,owner=0,bx=21,by=50,bvx=0,bvy=0,dx=0,dy=0,players=[],lastTouch=-1,kickCooldown=0,goalCooldown=0,kickoff=0,aiKickCooldown=0;let save=JSON.parse(localStorage.getItem('sf_save')||'null')||{name:'Player',coins:500,wins:0,losses:0,draws:0};$('coins').textContent='🪙 '+save.coins;
function add(side,name,x,y,role){const e=document.createElement('div');e.className='player '+(side==='H'?'home':'away')+(role==='GK'?' gk':'');e.innerHTML='<div class="head"></div><div class="body"></div><div class="leg l"></div><div class="leg r"></div><div class="name">'+name+'</div>';$('players').appendChild(e);players.push({side,name,x,y,homeX:x,homeY:y,role,e,phase:Math.random()*6.28,speed:side==='A'?.105:.095});}
function setup(){players=[];$('players').innerHTML='';add('H','YOU',18,50,'ST');add('H','A',31,25,'ST');add('H','B',31,75,'ST');add('H','C',43,40,'MF');add('H','GK',6,50,'GK');add('A','9',70,30,'ST');add('A','11',70,70,'ST');add('A','8',58,50,'MF');add('A','7',82,50,'ST');add('A','GK',94,50,'GK');controlled=0;owner=0;lastTouch=0;bx=21;by=50;bvx=.12;bvy=0;kickCooldown=1.1;goalCooldown=0;kickoff=1.4;aiKickCooldown=1;render();}
function render(){players.forEach((p,i)=>{p.e.style.left=p.x+'%';p.e.style.top=p.y+'%';p.e.classList.toggle('sel',i===controlled)});$('ball').style.left=bx+'%';$('ball').style.top=by+'%';$('hud').textContent=score[0]+' — '+score[1]+' · '+String(Math.floor(time/60)).padStart(2,'0')+':'+String(time%60).padStart(2,'0');$('status').textContent=kickoff>0?'KICK OFF':owner>=0?(players[owner].name+' has the ball'):'BALL IN PLAY';}
function start(){save.name=$('name').value.trim()||save.name||'Player';localStorage.setItem('sf_save',JSON.stringify(save));$('modal').style.display='none';running=true;matchOver=false;time=120;score=[0,0];setup();}
function move(p,tx,ty,s,dt){let ax=tx-p.x,ay=ty-p.y,d=Math.hypot(ax,ay);if(d>.05){let step=Math.min(d,s*dt);p.x+=ax/d*step;p.y+=ay/d*step;}}
function nearest(side,x,y,includeGK=false){let best=-1,bd=Infinity;players.forEach((p,i)=>{if(p.side!==side||(!includeGK&&p.role==='GK'))return;let d=Math.hypot(p.x-x,p.y-y);if(d<bd){bd=d;best=i;}});return best;}
function updateAI(dt,now){const t=now*.001;players.forEach((p,i)=>{if(i===controlled)return;let tx=p.homeX+Math.sin(t*1.4+p.phase)*6,ty=p.homeY+Math.cos(t*1.1+p.phase)*5;if(p.role==='GK'){const target=clamp(by,28,72);move(p,p.side==='H'?6:94,target,.12,dt);if(owner===i&&kickCooldown<=0){aiKick(i);}}else if(owner===i){const targetX=p.side==='A'?4:96;tx=targetX;ty=50+Math.sin(t+p.phase)*10;if(Math.hypot(tx-p.x,ty-p.y)<16&&aiKickCooldown<=0){aiKick(i);}}else if(owner>=0&&players[owner].side!==p.side){tx=clamp(bx+(p.side==='A'?4:-4),5,95);ty=by;}else if(owner===-1&&Math.hypot(p.x-bx,p.y-by)<38){tx=bx;ty=by;}else if(p.side==='H'){tx=p.homeX+Math.sin(t*1.7+p.phase)*9;ty=p.homeY+Math.cos(t*1.5+p.phase)*7;}move(p,tx,ty,p.speed,dt);});}
function aiKick(i){const p=players[i];if(owner!==i)return;const targetX=p.side==='A'?2:98,targetY=50+(Math.random()*20-10),d=Math.hypot(targetX-p.x,targetY-p.y)||1;owner=-1;lastTouch=i;bvx=(targetX-p.x)/d*(p.side==='A'?.27:.23);bvy=(targetY-p.y)/d*(p.side==='A'?.27:.23);kickCooldown=.65;aiKickCooldown=1.4;bx=p.x+(p.side==='A'?-3:3);by=p.y;}
function scoreGoal(team){if(goalCooldown>0)return;score[team]++;goalCooldown=2.2;owner=-1;bvx=bvy=0;save.coins+=team===0?50:0;save.name=save.name||'Player';localStorage.setItem('sf_save',JSON.stringify(save));$('coins').textContent='🪙 '+save.coins;statusGoal(team);}
function statusGoal(team){$('status').textContent=team===0?'⚽ GOAL! YOU SCORE!':'⚽ OPPONENT SCORES!';}
function resetKickoff(){players.forEach(p=>{p.x=p.homeX;p.y=p.homeY});controlled=0;owner=0;lastTouch=0;bx=21;by=50;bvx=.12;bvy=0;kickCooldown=.9;kickoff=1.3;goalCooldown=0;}
function updateBall(dt){if(goalCooldown>0){goalCooldown-=dt;bx=score[0]>score[1]?96:4;by=50;if(goalCooldown<=.05&&running)resetKickoff();return;}if(kickoff>0){kickoff-=dt;bx=21;by=50;return;}if(owner>=0){const p=players[owner];bx=p.x+(p.side==='H'?3.2:-3.2);by=p.y;return;}bx+=bvx*dt;by+=bvy*dt;bvx*=Math.pow(.985,dt);bvy*=Math.pow(.985,dt);if(by<5){by=5;bvy=Math.abs(bvy)*.75}if(by>95){by=95;bvy=-Math.abs(bvy)*.75}const inGoal=by>42&&by<58;if(bx<=1&&inGoal){scoreGoal(1);return}if(bx>=99&&inGoal){scoreGoal(0);return}if(bx<2){bx=2;bvx=Math.abs(bvx)*.75}if(bx>98){bx=98;bvx=-Math.abs(bvx)*.75}if(kickCooldown>0)return;let best=-1,bd=4.6;players.forEach((p,i)=>{if(Math.hypot(p.x-bx,p.y-by)<bd){if(i===lastTouch&&kickCooldown>0)return;bd=Math.hypot(p.x-bx,p.y-by);best=i;}});if(best>=0){owner=best;lastTouch=best;bvx=bvy=0;}}
function loop(now){if(!loop.last)loop.last=now;let dt=Math.min(.032,(now-loop.last)/1000);loop.last=now;if(running){kickCooldown=Math.max(0,kickCooldown-dt);aiKickCooldown=Math.max(0,aiKickCooldown-dt);const p=players[controlled];if(kickoff<=0&&goalCooldown<=0){p.x=clamp(p.x+dx*8.5*dt,3,97);p.y=clamp(p.y+dy*8.5*dt,5,95);if(owner===controlled){bx=p.x+3.2;by=p.y;}}updateBall(dt);updateAI(dt,now);render();}requestAnimationFrame(loop);}
function pass(){if(!running||kickoff>0||owner!==controlled||kickCooldown>0)return;const p=players[controlled];const mates=players.map((q,i)=>({q,i,d:Math.hypot(q.x-p.x,q.y-p.y)})).filter(o=>o.q.side==='H'&&o.i!==controlled&&o.q.role!=='GK');if(!mates.length)return;mates.sort((a,b)=>a.d-b.d);const target=mates.find(o=>o.q.x>p.x)||mates[0];const d=Math.hypot(target.q.x-p.x,target.q.y-p.y)||1;owner=-1;lastTouch=controlled;bx=p.x+3;by=p.y;bvx=(target.q.x-p.x)/d*.25;bvy=(target.q.y-p.y)/d*.25;kickCooldown=.35;}
function shoot(){if(!running||kickoff>0||owner!==controlled||kickCooldown>0)return;const p=players[controlled],targetY=50+(Math.random()*12-6),d=Math.hypot(99-p.x,targetY-p.y)||1;owner=-1;lastTouch=controlled;bx=p.x+3;by=p.y;bvx=(99-p.x)/d*.36;bvy=(targetY-p.y)/d*.36;kickCooldown=.55;}
function tackle(){if(!running||kickoff>0)return;const p=players[controlled];let target=players.map((q,i)=>({q,i,d:Math.hypot(q.x-p.x,q.y-p.y)})).filter(o=>o.q.side==='A'&&o.d<10).sort((a,b)=>a.d-b.d)[0];if(target){owner=controlled;lastTouch=controlled;bx=p.x+3;by=p.y;kickCooldown=.45;}}
function sw(){if(!running)return;const c=players.map((p,i)=>({p,i})).filter(o=>o.p.side==='H'&&o.p.role!=='GK');let q=c.findIndex(o=>o.i===controlled);controlled=c[(q+1+c.length)%c.length].i;if(owner>=0&&players[owner].side==='H'){owner=controlled;lastTouch=controlled;bx=players[controlled].x+3;by=players[controlled].y;}}
function finish(){running=false;matchOver=true;joyStop();let result=score[0]>score[1]?'WIN!':score[0]<score[1]?'LOSS':'DRAW';if(result==='WIN'){save.wins++;save.coins+=100}else if(result==='LOSS')save.losses++;else save.draws++;localStorage.setItem('sf_save',JSON.stringify(save));$('coins').textContent='🪙 '+save.coins;$('modal').style.display='grid';$('modal').querySelector('.panel').innerHTML='<h1>'+result+'</h1><p style="font-size:28px;font-weight:900">'+score[0]+' — '+score[1]+'</p><div class="stats"><div class="stat"><b>'+save.wins+'</b><br>Wins</div><div class="stat"><b>'+save.draws+'</b><br>Draws</div><div class="stat"><b>'+save.losses+'</b><br>Losses</div></div><p>🪙 '+save.coins+' coins</p><button class="primary" id="rematch">REMATCH</button><button class="primary" id="menu" style="background:#263b2b">MENU</button>';$('rematch').onclick=start;$('menu').onclick=()=>location.reload();}
function joyMove(e){e.preventDefault();const r=$('joy').getBoundingClientRect();let a=e.clientX-r.left-r.width/2,b=e.clientY-r.top-r.height/2,d=Math.hypot(a,b),m=38;if(d>m){a=a/d*m;b=b/d*m}$('stick').style.transform='translate('+a+'px,'+b+'px)';dx=a/m;dy=b/m}
function joyStop(){dx=dy=0;$('stick').style.transform=''}
$('start').onclick=start;$('pass').onpointerdown=pass;$('shoot').onpointerdown=shoot;$('tackle').onpointerdown=tackle;$('switch').onpointerdown=sw;const j=$('joy');j.addEventListener('pointerdown',e=>{try{j.setPointerCapture(e.pointerId)}catch(_){}joyMove(e)});j.addEventListener('pointermove',joyMove);['pointerup','pointercancel','lostpointercapture'].forEach(ev=>j.addEventListener(ev,joyStop));setInterval(()=>{if(running&&!matchOver){time--;if(time<=0)finish()}},1000);requestAnimationFrame(loop);
</script></body></html>
