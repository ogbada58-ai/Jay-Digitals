<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Address Book — MARVY SIGNATURE</title><style>:root{--gold:#d4af37;--dark:#111;--bg:#f5f5f5;--muted:#777}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Arial;color:#222}.top{background:#111;color:#fff;padding:17px 5%;display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:800;letter-spacing:2px}.brand span{color:var(--gold)}.top a{color:#fff;text-decoration:none}.wrap{max-width:950px;margin:25px auto;padding:0 16px}.hero{background:linear-gradient(120deg,#171717,#3a2c08);color:#fff;border-radius:12px;padding:25px;margin-bottom:18px}.hero h1{font:700 30px Georgia;margin:5px 0}.card{background:#fff;border-radius:10px;box-shadow:0 4px 18px #0001;padding:24px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.title{font:700 27px Georgia;margin:0}.btn{background:#111;color:#fff;border:0;border-radius:6px;padding:11px 16px;font-weight:700;cursor:pointer}.gold{background:var(--gold);color:#111}.address{border:1px solid #e5e5e5;border-radius:9px;padding:18px;margin-top:14px}.address.default{border:1.5px solid var(--gold);background:#fffdf5}.badge{background:#f7edc5;color:#765d00;border-radius:12px;padding:5px 9px;font-size:10px;font-weight:700}.actions{margin-top:14px}.danger{background:none;border:0;color:#a22;cursor:pointer;font-weight:700}.muted{color:var(--muted);font-size:13px}.empty{text-align:center;padding:45px 15px;color:var(--muted)}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modalbox{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:520px}.close{float:right;border:0;background:none;font-size:25px;cursor:pointer}.field{margin:12px 0}.field label{display:block;font-size:11px;font-weight:700;margin-bottom:5px}.field input{width:100%;padding:12px;border:1px solid #ddd;border-radius:6px;font-size:14px}.check{display:flex;gap:8px;align-items:center;margin:13px 0}.status{font-size:12px;margin-top:10px}.error{color:#a22}.success{color:green}@media(max-width:550px){.head{align-items:flex-start;flex-direction:column}.card{padding:18px}.hero h1{font-size:25px}.btn{width:100%}}</style></head><body><header class="top"><div class="brand">MARVY <span>SIGNATURE</span></div><a href="account.html">← My Account</a></header><main class="wrap"><section class="hero"><small>MY MARVY ACCOUNT</small><h1>Address Book</h1><div>Manage your delivery addresses</div></section><section class="card"><div class="head"><h2 class="title">Saved Addresses</h2><button class="btn gold" onclick="openForm()">+ ADD NEW ADDRESS</button></div><div id="list"><div class="empty">Loading your addresses...</div></div></section></main><div class="modal" id="modal"><div class="modalbox"><button class="close" onclick="closeForm()">×</button><h2 id="formTitle">Add New Address</h2><div class="field"><label>FULL NAME</label><input id="name" autocomplete="name"></div><div class="field"><label>PHONE NUMBER</label><input id="phone" type="tel" autocomplete="tel"></div><div class="field"><label>STREET ADDRESS</label><input id="address" autocomplete="street-address"></div><div class="field"><label>CITY</label><input id="city" autocomplete="address-level2"></div><div class="field"><label>STATE</label><input id="state" autocomplete="address-level1"></div><label class="check"><input id="default" type="checkbox"> Set as default delivery address</label><button class="btn gold" onclick="save()">SAVE ADDRESS</button><div id="msg" class="status"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://lspiygozawcwgjgsysld.supabase.co','sb_publishable_v-eHoJfEPdOjv-EASPiwSw_Gz7TzjNc');let user,editId=null;const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){const{data,error}=await db.auth.getSession();if(error||!data.session)return location.replace('signin.html');user=data.session.user;load()}async function load(){const{data,error}=await db.from('addresses').select('*').eq('user_id',user.id).order('is_default',{ascending:false}).order('created_at',{ascending:false});if(error){$('list').innerHTML='<div class="empty">Your Address Book needs the Supabase addresses table to be enabled. Once it is enabled, you can save and manage delivery addresses here.</div>';return}if(!data.length){$('list').innerHTML='<div class="empty">You have no saved addresses yet.<br><br>Add your first delivery address above.</div>';return}$('list').innerHTML=data.map(a=>`<article class="address ${a.is_default?'default':''}"><b>${esc(a.full_name)}</b> ${a.is_default?'<span class="badge">DEFAULT</span>':''}<p>${esc(a.phone)}<br>${esc(a.address)}<br>${esc(a.city)}, ${esc(a.state)}, Nigeria</p><div class="actions"><button class="btn" onclick="edit('${a.id}')">EDIT</button> ${!a.is_default?`<button class="danger" onclick="makeDefault('${a.id}')">SET AS DEFAULT</button>`:''} <button class="danger" onclick="removeAddress('${a.id}')">DELETE</button></div></article>`).join('')}function openForm(){editId=null;$('formTitle').textContent='Add New Address';['name','phone','address','city','state'].forEach(x=>$(x).value='');$('default').checked=false;$('msg').textContent='';$('modal').classList.add('show')}function closeForm(){$('modal').classList.remove('show')}async function edit(id){const{data,error}=await db.from('addresses').select('*').eq('id',id).eq('user_id',user.id).single();if(error)return;editId=id;$('formTitle').textContent='Edit Address';$('name').value=data.full_name||'';$('phone').value=data.phone||'';$('address').value=data.address||'';$('city').value=data.city||'';$('state').value=data.state||'';$('default').checked=!!data.is_default;$('msg').textContent='';$('modal').classList.add('show')}async function save(){const p={full_name:$('name').value.trim(),phone:$('phone').value.trim(),address:$('address').value.trim(),city:$('city').value.trim(),state:$('state').value.trim()};if(Object.values(p).some(v=>!v)){$('msg').textContent='Please complete every field.';$('msg').className='status error';return}if($('default').checked)await db.from('addresses').update({is_default:false}).eq('user_id',user.id);let r=editId?await db.from('addresses').update({...p,is_default:$('default').checked}).eq('id',editId).eq('user_id',user.id):await db.from('addresses').insert({...p,is_default:$('default').checked,user_id:user.id});if(r.error){$('msg').textContent='Could not save. Make sure the Supabase addresses table has been created.';$('msg').className='status error';return}closeForm();load()}async function makeDefault(id){await db.from('addresses').update({is_default:false}).eq('user_id',user.id);await db.from('addresses').update({is_default:true}).eq('id',id).eq('user_id',user.id);load()}async function removeAddress(id){if(!confirm('Delete this saved address?'))return;await db.from('addresses').delete().eq('id',id).eq('user_id',user.id);load()}init();</script></body></html>
