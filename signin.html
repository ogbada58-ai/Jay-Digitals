<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In — MARVY SIGNATURE</title><style>:root{--gold:#c9a227;--muted:#777;--line:#e9e5da}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#080808,#1c1c1c 60%,#342b18);font-family:Arial,sans-serif;color:#111;display:flex;align-items:center;justify-content:center;padding:24px}.page{width:min(460px,100%)}.brand{text-align:center;color:#fff;font-size:28px;font-weight:700;letter-spacing:2px;margin-bottom:24px}.brand span{color:#e4c75a}.card{background:#fff;border-radius:12px;padding:36px;box-shadow:0 25px 70px #0008}.eyebrow{text-align:center;color:var(--gold);font-size:12px;font-weight:700;letter-spacing:2px}.title{text-align:center;font-size:30px;margin:8px 0}.intro{text-align:center;color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:26px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:17px;font-weight:600;font-size:14px}.field input{width:100%;padding:14px;border:1px solid var(--line);border-radius:6px;outline:none;font-size:16px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;margin-bottom:20px}.remember{display:flex;align-items:center;gap:7px;color:var(--muted)}.forgot{color:#9b7a13;font-weight:600;background:none;border:0;padding:0;cursor:pointer}.btn{width:100%;padding:14px;background:#111;color:#fff;border:0;border-radius:6px;font-weight:700;cursor:pointer;font-size:15px}.btn:disabled{opacity:.6;cursor:wait}.message{display:none;margin-top:16px;padding:12px;border-radius:6px;background:#f7f4ec;font-size:13px;text-align:center}.message.show{display:block}.signup{text-align:center;color:var(--muted);font-size:14px;margin-top:22px}.signup a{color:#9b7a13;font-weight:700}.back{display:block;text-align:center;color:#fff;margin-top:18px;font-size:14px}.security{text-align:center;color:#999;font-size:11px;margin-top:20px}@media(max-width:500px){.card{padding:28px 22px}}</style></head><body><main class="page"><div class="brand">MARVY <span>SIGNATURE</span></div><section class="card"><div class="eyebrow">WELCOME BACK</div><h1 class="title">Sign in to your account</h1><p class="intro">Access your MARVY SIGNATURE customer account.</p><form id="loginForm"><label class="field">Email address<input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></label><label class="field">Password<input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required minlength="6"></label><div class="row"><label class="remember"><input type="checkbox" id="remember"> Remember me</label><button class="forgot" id="forgotBtn" type="button">Forgot password?</button></div><button class="btn" id="submitBtn" type="submit">SIGN IN</button><div class="message" id="message"></div></form><div class="signup">Don't have an account? <a href="signup.html">Create one</a></div></section><a class="back" href="index.html">← Back to MARVY SIGNATURE</a><div class="security">Authentication is securely handled by Supabase.</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(function(){
const URL='https://lspiygozawcwgjgsysld.supabase.co';
const KEY='sb_publishable_v-eHoJfEPdOjv-EASPiwSw_Gz7TzjNc';
const message=document.getElementById('message'),button=document.getElementById('submitBtn'),form=document.getElementById('loginForm');
function show(t){message.textContent=t;message.classList.add('show')}
function getClient(){if(!window.supabase||!window.supabase.createClient){show('Login service is still loading. Please wait a moment and try again.');return null}return window.supabase.createClient(URL,KEY)}
form.addEventListener('submit',async function(e){e.preventDefault();message.classList.remove('show');button.disabled=true;button.textContent='SIGNING IN...';try{const client=getClient();if(!client){return}const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;const result=await client.auth.signInWithPassword({email:email,password:password});if(result.error){show(result.error.message);return}show('Signed in successfully. Redirecting...');setTimeout(function(){window.location.href='index.html'},500)}catch(err){show('Unable to sign in right now. Please check your internet connection and try again.')}finally{button.disabled=false;button.textContent='SIGN IN'}});
document.getElementById('forgotBtn').addEventListener('click',async function(){message.classList.remove('show');const email=document.getElementById('email').value.trim();if(!email){show('Enter your email address first.');return}try{const client=getClient();if(!client)return;const result=await client.auth.resetPasswordForEmail(email,{redirectTo:window.location.origin+'/signin.html'});if(result.error){show(result.error.message);return}show('If that email has an account, a password-reset email has been sent.')}catch(err){show('Unable to send the reset email right now.')}});
})();
</script></body></html>
