<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In — MARVY SIGNATURE</title><style>:root{--gold:#c9a227;--muted:#777;--line:#e9e5da}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#080808,#1c1c1c 60%,#342b18);font-family:Arial,sans-serif;color:#111;display:flex;align-items:center;justify-content:center;padding:24px}.page{width:min(460px,100%)}.brand{text-align:center;color:#fff;font-size:28px;font-weight:700;letter-spacing:2px;margin-bottom:24px}.brand span{color:#e4c75a}.card{background:#fff;border-radius:12px;padding:36px;box-shadow:0 25px 70px #0008}.eyebrow{text-align:center;color:var(--gold);font-size:12px;font-weight:700;letter-spacing:2px}.title{text-align:center;font-size:30px;margin:8px 0}.intro{text-align:center;color:var(--muted);font-size:14px;line-height:1.6;margin-bottom:26px}.field{display:flex;flex-direction:column;gap:7px;margin-bottom:17px;font-weight:600;font-size:14px}.field input{width:100%;padding:14px;border:1px solid var(--line);border-radius:6px;outline:none;font-size:16px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px;margin-bottom:20px}.remember{display:flex;align-items:center;gap:7px;color:var(--muted)}.forgot{color:#9b7a13;font-weight:600;background:none;border:0;padding:0;cursor:pointer}.btn{width:100%;padding:14px;background:#111;color:#fff;border:0;border-radius:6px;font-weight:700;cursor:pointer;font-size:15px}.btn:disabled{opacity:.6;cursor:wait}.message{display:none;margin-top:16px;padding:12px;border-radius:6px;background:#f7f4ec;font-size:13px;text-align:center}.message.show{display:block}.signup{text-align:center;color:var(--muted);font-size:14px;margin-top:22px}.signup a{color:#9b7a13;font-weight:700}.back{display:block;text-align:center;color:#fff;margin-top:18px;font-size:14px}.security{text-align:center;color:#999;font-size:11px;margin-top:20px}</style></head><body><main class="page"><div class="brand">MARVY <span>SIGNATURE</span></div><section class="card"><div class="eyebrow">WELCOME BACK</div><h1 class="title">Sign in to your account</h1><p class="intro">Access your MARVY SIGNATURE customer account.</p><form id="loginForm"><label class="field">Email address<input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></label><label class="field">Password<input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required minlength="6"></label><div class="row"><label class="remember"><input type="checkbox" id="remember"> Remember me</label><button class="forgot" id="forgotBtn" type="button">Forgot password?</button></div><button class="btn" id="submitBtn" type="submit">SIGN IN</button><div class="message" id="message"></div></form><div class="signup">Don't have an account? <a href="signup.html">Create one</a></div></section><a class="back" href="index.html">← Back to MARVY SIGNATURE</a></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(function(){const URL='https://lspiygozawcwgjgsysld.supabase.co',KEY='sb_publishable_v-eHoJfEPdOjv-EASPiwSw_Gz7TzjNc';const form=document.getElementById('loginForm'),msg=document.getElementById('message'),btn=document.getElementById('submitBtn');function show(t){msg.textContent=t;msg.classList.add('show')}form.addEventListener('submit',async e=>{e.preventDefault();msg.classList.remove('show');btn.disabled=true;btn.textContent='SIGNING IN...';try{if(!window.supabase?.createClient){show('Login service failed to load. Refresh and try again.');return}const client=window.supabase.createClient(URL,KEY);const {data,error}=await client.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error){show(error.message);return}if(data.session){window.location.replace('account-dashboard.html')}else{show('Login completed, but no active session was created.')}}catch(err){show('Unable to sign in. Please check your internet connection.')}finally{btn.disabled=false;btn.textContent='SIGN IN'}});document.getElementById('forgotBtn').onclick=async()=>{const email=document.getElementById('email').value.trim();if(!email){show('Enter your email address first.');return}try{const client=window.supabase.createClient(URL,KEY);const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:window.location.href});if(error)show(error.message);else show('If the account exists, a reset email has been sent.')}catch(e){show('Unable to send the reset email right now.')}}})();</script></body></html>
