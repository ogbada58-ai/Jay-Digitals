row">JOIN MARVY SIGNATURE</div><h1 class="title">Create your account</h1><p class="intro">Create a secure customer account to make shopping and checkout easier.</p><form id="signupForm"><label class="field">Full name<input id="fullName" type="text" autocomplete="name" placeholder="Your full name" required minlength="2"></label><label class="field">Email address<input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></label><label class="field">Password<input id="password" type="password" autocomplete="new-password" placeholder="At least 6 characters" required minlength="6"></label><label class="field">Confirm password<input id="confirm" type="password" autocomplete="new-password" placeholder="Re-enter your password" required minlength="6"></label><button class="btn" id="submitBtn" type="submit">CREATE ACCOUNT</button><div class="message" id="message"></div></form><div class="signin">Already have an account? <a href="signin.html">Sign in</a></div></section><a class="back" href="index.html">← Back to MARVY SIGNATURE</a><div class="security">Authentication is securely handled by Supabase.</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(function(){const form=document.getElementById('signupForm'),msg=document.getElementById('message'),btn=document.getElementById('submitBtn');function show(t,c){msg.textContent=t;msg.className='message show '+(c||'error')}const client=supabase.createClient('https://lspiygozawcwgjgsysld.supabase.co','sb_publishable_v-eHoJfEPdOjv-EASPiwSw_Gz7TzjNc');form.onsubmit=async e=>{e.preventDefault();const name=fullName.value.trim(),email=emailEl=document.getElementById('email').value.trim(),p=password.value,c=confirm.value;if(name.length<2)return show('Please enter your full name.');if(!email||!document.getElementById('email').checkValidity())return show('Please enter a valid email address.');if(p.length<6)return show('Password must be at least 6 characters.');if(p!==c)return show('Passwords do not match.');btn.disabled=true;btn.textContent='CREATING ACCOUNT...';try{const{data,error}=await client.auth.signUp({email,password:p,options:{emailRedirectTo:new URL('signin.html',location.href).href,data:{full_name:name}}});if(error)show(error.message);else if(data.session){show('Account created! Redirecting...','success');setTimeout(()=>location.replace('account-dashboard.html'),500)}else{show('Account created! Check your email to confirm, then sign in.','success');form.reset()}}catch(x){show('Unable to create the account right now. Please try again.')}finally{btn.disabled=false;btn.textContent='CREATE ACCOUNT'}}})();</script></body></html>
