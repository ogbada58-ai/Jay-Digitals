name: Store polish and account state

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply premium design and auth behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Load the premium visual layer once.
          if 'premium.css' not in s:
              s = s.replace('</head>', '<link rel="stylesheet" href="premium.css">\n</head>', 1)

          # Ensure the account button has a stable id.
          old = '<a class="account" href="signin.html">SIGN IN / ACCOUNT</a>'
          new = '<a class="account" id="marvy-account" href="signin.html">SIGN IN / ACCOUNT</a>'
          s = s.replace(old, new, 1)

          # Remove the older account-hiding block if it exists, then add a reliable version.
          start = s.find('<style>\n#marvy-account.authenticated-hidden')
          if start != -1:
              end = s.find('</script>', start)
              if end != -1:
                  s = s[:start] + s[end + len('</script>'):]

          block = '''<style>
#marvy-account.authenticated-hidden{display:none!important}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
document.addEventListener('DOMContentLoaded', async function(){
  try{
    const client=window.supabase.createClient('https://lspiygozawcwgjgsysld.supabase.co','sb_publishable_v-eHoJfEPdOjv-EASPiwSw_Gz7TzjNc');
    const {data:{session}}=await client.auth.getSession();
    const account=document.getElementById('marvy-account');
    if(account && session) account.classList.add('authenticated-hidden');
  }catch(e){}
});
</script>
'''
          marker = '</head>'
          if 'document.addEventListener(\'DOMContentLoaded\'' not in s:
              s = s.replace(marker, block + marker, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit generated store update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html premium.css
          git diff --cached --quiet || git commit -m "Upgrade MARVY SIGNATURE storefront design"
          git push
